# Render Blueprint (optional): creates a Node web service, not static GitHub Pages.
# Connect this GitHub repository in Render and import this Blueprint.
# Add your TMDB API key in the host dashboard; never commit it.
services:
  - type: web
    name: moosa-web
    runtime: node
    rootDir: MOOSAWeb
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TMDB_API_KEY
        sync: false
