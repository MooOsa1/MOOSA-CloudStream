name: MOOSA Arabic v2 validation (no release)
on:
  push:
    branches: ["feature/moosa-arabic-v2"]
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build plugins without publishing
        run: |
          gradle :MOOSAArabic:make :MOOSAHub:make makePluginsJson
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("build/plugins.json").read_text())
          assert {x["internalName"] for x in p}=={"MOOSAArabic","MOOSAHub"}
          print("Isolated build output verified")
          PY
      - name: Check native catalog and movie/episode pages
        run: |
          python3 -m pip install --quiet beautifulsoup4
          python3 diagnostics/moosa_arabic_native_catalog.py
      - name: Check native source structure and pagination
        run: python3 diagnostics/moosa_arabic_v2_probe.py
