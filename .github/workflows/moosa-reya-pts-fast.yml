name: Reya PTS fast exact VidNest beta/catflix check
on:
  push:
    branches: [audit/moosa-live-4k-20261024]
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe short bounded media sample from selected video server
        shell: python
        run: |
          import urllib.request,urllib.parse,subprocess,re,json,tempfile
          H={"User-Agent":"Mozilla/5.0 (Linux; Android 7.1.2) AppleWebKit/537.36 Chrome/123 Safari/537.36"}
          def get(url,n=3000000):
              with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=10) as res:
                  return res.read(n)
          obj=json.loads(get("https://vidnst.reyamika.eu.cc/api/stream?tmdbId=60059&type=tv&season=2&episode=5",240000))
          for src in obj["streams"][:2]:
              server=src.get("server","unknown")
              print("SERVER",server,flush=True)
              try:
                  master=get(src["url"],90000).decode()
                  ls=master.splitlines()
                  options=[]
                  for i,l in enumerate(ls[:-1]):
                      m=re.search(r'RESOLUTION=\d+x(\d+)',l)
                      if l.startswith("#EXT-X-STREAM-INF:") and m:
                          options.append((int(m.group(1)),urllib.parse.urljoin(src["url"],ls[i+1].strip())))
                  print("HLS OPTIONS",[(h,) for h,u in options],flush=True)
                  for h,u in sorted(options,reverse=True):
                      if h not in (2160,1080,720): continue
                      data=get(u,120000).decode()
                      seg=[x.strip() for x in data.splitlines() if x.strip() and not x.startswith("#")]
                      dur=[float(x) for x in re.findall(r'#EXTINF:([\d.]+)',data)]
                      mapvalue=re.search(r'#EXT-X-MAP:.*URI="([^"]+)"',data)
                      print("MEDIA",server,h,"duration",round(sum(dur),3),"segments",len(seg),"MAP",bool(mapvalue),flush=True)
                      if not mapvalue or not seg:continue
                      init=get(urllib.parse.urljoin(u,mapvalue.group(1)),90000)
                      frag=get(urllib.parse.urljoin(u,seg[0]),8000000)
                      with tempfile.NamedTemporaryFile(suffix=".mp4") as f:
                          f.write(init+frag);f.flush()
                          p=subprocess.run(["ffprobe","-v","error","-show_entries","stream=codec_type,codec_name,start_time,duration:format=start_time,duration","-of","json",f.name],capture_output=True,text=True,timeout=12)
                          print("FFPROBE",server,h,p.stdout[:1500] if p.returncode==0 else p.stderr[:220],flush=True)
                      break
              except Exception as e:print("ERROR",server,type(e).__name__,str(e)[:130],flush=True)
