name: Validate MOOSA Hub v82 progressive subtitles (no release)
on:
  push:
    branches: ["fix/moosa-hub-v82-progressive-subtitles"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  regress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Compile both plugins and generate the release manifest
        run: gradle :MOOSAHub:make :MOOSAArabic:make makePluginsJson ensureJarCompatibility
      - name: Assert progressive subtitle callbacks, bounded network usage and old capabilities
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path("MOOSAHub/src/main/kotlin/com/moosa/hub")
          p=(base/"MOOSAHubProvider.kt").read_text()
          mf={x["internalName"]:x["version"] for x in json.loads(Path("build/plugins.json").read_text())}
          assert mf.get("MOOSAHub",0)>=82 and mf.get("MOOSAArabic")==3,mf
          assert "onEarlyCandidates: suspend (List<SubtitleFile>) -> Unit" in p
          assert "if (primary.isNotEmpty()) onEarlyCandidates(primary)" in p
          assert "onEarlyCandidates(cached.items)" in p
          assert "val primaryUrls = primary.map { it.url }.toHashSet()" in p
          assert "all.filterNot { it.url in primaryUrls }" in p
          assert "onVerified(subtitle)" in p
          assert "private suspend fun filterReadableSubtitles(" in p
          assert "byLanguage[PreferredSubtitleLanguage.ARABIC].orEmpty().take(10)" in p
          assert "byLanguage[PreferredSubtitleLanguage.ENGLISH].orEmpty().take(5)" in p
          assert "val subtitleProbeGate = kotlinx.coroutines.sync.Semaphore(4)" in p
          assert 'val prefix = if (language == PreferredSubtitleLanguage.ARABIC)' in p
          assert 'PreferredSubtitleLanguage.OTHER -> null' in p
          assert 'subtitleCallback(track)' in p
          assert 'val later = fetchExternalSubtitles(request) { first ->' in p
          assert 'first, ::emitVerifiedSubtitle, subtitleProbeGate' in p
          assert 'filterReadableSubtitles(nativeSubtitles.toList(), ::emitVerifiedSubtitle, subtitleProbeGate)' in p
          assert 'if (emittedLink.get()) {' in p
          assert "withTimeoutOrNull(3200L)" in p
          assert "(sub.headers ?: emptyMap())" in p
          assert "subtitleTiming.containsMatchIn(body)" in p
          assert "synopsisJob" in p and "MOOSAProgress.serversReady" in p
          print("PASS: v82 sends each valid Arabic/English subtitle before slow backups, avoids 36-file I/O bursts and bounds final video readiness")
          PY
      - name: Probe actual SRT files and video-independent subtitle source response
        run: |
          python3 - <<'PY'
          import json,urllib.request,re,time
          cases=[("movie","tt0816692"),("series","tt0944947:1:1")]
          for typ,ident in cases:
              start=time.monotonic()
              with urllib.request.urlopen(urllib.request.Request(f"https://opensubtitles-v3.strem.io/subtitles/{typ}/{ident}.json",headers={"User-Agent":"Mozilla/5.0"}),timeout=15) as response:
                  subtitles=json.load(response)["subtitles"]
              print("INDEX",typ,round(time.monotonic()-start,2),len(subtitles),flush=True)
              for lang in ("ara","eng"):
                  files=[x["url"] for x in subtitles if x.get("lang")==lang and x.get("url","").startswith("https://")]
                  assert files,(typ,lang)
                  found=False
                  for url in files[:4]:
                      try:
                          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Range":"bytes=0-32767"}),timeout=12) as r:
                              data=r.read(32768)
                          s=data.decode("utf-8",errors="replace")
                          timing=bool(re.search(r"(?:\d{1,2}:)?\d{2}:\d{2}[,.]\d{1,3}\s*-->\s*(?:\d{1,2}:)?\d{2}:\d{2}[,.]\d{1,3}",s))
                          lang_chars=sum('\u0600'<=c<='\u06ff' for c in s) if lang=="ara" else sum('a'<=c.lower()<='z' for c in s)
                          if timing and lang_chars>12:
                              found=True
                              break
                      except Exception as e: print("RETRY",typ,lang,type(e).__name__,flush=True)
                  assert found,(typ,lang)
                  print("PASS_SUB",typ,lang,len(files),flush=True)
          PY
