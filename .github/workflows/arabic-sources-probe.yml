name: Probe Arabic source endpoints
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "diagnostics/arabic_sources_probe.py"
      - "diagnostics/arabseed_download_probe.py"
      - "diagnostics/arabseed_arabic_regression.py"
      - "diagnostics/original_title_arabic_playback_probe.py"
      - ".github/workflows/arabic-sources-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Prepare HTML parser
        run: python3 -m pip install --quiet beautifulsoup4
      - name: Test ArabSeed, WeCima and CimaClub discovery
        run: python3 diagnostics/arabic_sources_probe.py
      - name: Probe ArabSeed direct FHD download mirrors
        run: python3 diagnostics/arabseed_download_probe.py
      - name: Check Arabic ArabSeed episodes and movies
        run: python3 diagnostics/arabseed_arabic_regression.py
      - name: Diagnose original names and Arabic CDN throughput
        run: python3 diagnostics/original_title_arabic_playback_probe.py
