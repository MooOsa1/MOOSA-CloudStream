name: Free film shelf mobile browser
on:
  push:
    branches: [feature/free-film-library]
    paths:
      - 'MOOSAWeb/**'
      - '.github/workflows/free-film-shelf-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: MOOSAWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify full licensed-film shelf on mobile and old demo
        run: |
          node tests/free-library-mobile.e2e.mjs
          node tests/free-film-browser.e2e.mjs
