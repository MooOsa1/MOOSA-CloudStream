name: MOOSA live 4K source reachability audit (no release)
on:
  push:
    branches:
      - 'audit/moosa-live-4k-20261024'
  workflow_dispatch:
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check real public source endpoints and 4K catalog markup
        shell: python
        run: |
          import concurrent.futures
          import re
          import urllib.request
          import urllib.error
          import urllib.parse
          import time
          import html
          
          UA = {"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123 Safari/537.36",
                "Accept":"text/html,application/json;q=0.9,*/*;q=0.8"}
          targets = [
            ("4khdhub-home","https://4khdhub.one/"),
            ("4khdhub-bcs","https://4khdhub.one/?s=Better+Call+Saul"),
            ("4khdhub-dune2","https://4khdhub.one/?s=Dune+Part+Two"),
            ("4khdhub-godfather","https://4khdhub.one/?s=The+Godfather"),
            ("directory-bcs-s02","https://a.111477.xyz/tvs/Better%20Call%20Saul/Season%2002/"),
            ("directory-dune2","https://a.111477.xyz/movies/Dune%20Part%20Two%20%282024%29/"),
            ("netmirror-bcs-s02e03","https://net27.cc/api/embed-tmdb/60059?type=tv&se=2&ep=3"),
            ("netmirror-godfather","https://net27.cc/api/embed-tmdb/238"),
          ]
          def check(item):
            label,url=item
            req=urllib.request.Request(url,headers=UA)
            code=0
            try:
              with urllib.request.urlopen(req,timeout=12) as res:
                code=res.status
                final=res.geturl()
                data=res.read(240000).decode("utf-8",errors="replace")
                kind=res.headers.get("Content-Type","")
            except urllib.error.HTTPError as e:
              code=e.code
              final=url
              data=e.read(4096).decode("utf-8",errors="replace")
              kind=e.headers.get("Content-Type","")
            except Exception as e:
              return f"{label}: NETWORK_ERROR {type(e).__name__}: {str(e)[:100]}"
            markers={p:len(re.findall(p,data,re.I)) for p in [
                "movie-card", "episodes-list", "season-item", "episode-download-item",
                "download-item", "2160p", "1080p", "mkv", "cloudflare", "captcha",
                "content-range", "currentEpisode", "streams"
              ]}
            # Only public structural counts. Never print any signed media URLs.
            text_sample = re.sub(r"<[^>]+>"," ",data[:2000])
            text_sample = " ".join(html.unescape(text_sample).split())[:140]
            return f"{label}: HTTP {code}; finalHost={urllib.parse.urlparse(final).hostname}; kind={kind[:50]}; len={len(data)}; markers={markers}; intro={text_sample!r}"
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
            for line in ex.map(check,targets):
              print(line,flush=True)

      - name: Inspect matched BCS page episode markup and UHD release labels
        shell: python
        run: |
          import re, html, urllib.request, urllib.parse, urllib.error
          headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/123 Safari/537.36"}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=16) as resp:
                  return resp.read(500000).decode('utf8','replace')
          def plain(t):
              return " ".join(html.unescape(re.sub(r'<[^>]*>',' ',t)).split())
          for title in ["Better Call Saul", "Dune Part Two"]:
              search=get("https://4khdhub.one/?s="+urllib.parse.quote_plus(title))
              cards=re.findall(r'<a\b[^>]*class="[^"]*\bmovie-card\b[^"]*"[^>]*>.*?</a>',search,re.S|re.I)
              print(title,"CARD COUNT",len(cards),flush=True)
              for card in cards[:12]:
                  attr=re.search(r'\bhref="([^"]+)"',card)
                  cardTitle=re.search(r'class="[^"]*movie-card-title[^"]*"[^>]*>(.*?)</',card,re.S|re.I)
                  cardMeta=re.search(r'class="[^"]*movie-card-meta[^"]*"[^>]*>(.*?)</',card,re.S|re.I)
                  shortTitle=plain(cardTitle.group(1)) if cardTitle else plain(card)[:100]
                  shortMeta=plain(cardMeta.group(1)) if cardMeta else ""
                  print("CARD",repr(shortTitle[:110]),repr(shortMeta[:110]),"href",attr.group(1)[:145] if attr else None,flush=True)
                  if title.lower() not in shortTitle.lower(): continue
                  if attr is None: continue
                  href=urllib.parse.urljoin("https://4khdhub.one",html.unescape(attr.group(1)))
                  if urllib.parse.urlparse(href).hostname != "4khdhub.one": continue
                  try:
                      body=get(href)
                      print("DETAIL title",repr(shortTitle),"bytes",len(body),
                            "episode-list",len(re.findall(r'episodes-list',body,re.I)),
                            "season-item",len(re.findall(r'season-item',body,re.I)),
                            "episode-download-item",len(re.findall(r'episode-download-item',body,re.I)),
                            "download-item",len(re.findall(r'download-item',body,re.I)),
                            "2160p",len(re.findall(r'2160p',body,re.I)),flush=True)
                      for pat in [r'class="[^"]*episode-file-info[^"]*"[^>]*>(.*?)</div>',
                                  r'class="[^"]*file-title[^"]*"[^>]*>(.*?)</']:
                          samples=[plain(x)[:180] for x in re.findall(pat,body,re.S|re.I)]
                          print("DETAIL SAMPLES",samples[:10],flush=True)
                  except Exception as e:
                      print("DETAIL ERROR",type(e).__name__,str(e)[:130],flush=True)

      - name: Inspect S02 episode structure and exact UHD presence
        shell: python
        run: |
          import re,urllib.request,html,urllib.parse
          url="https://4khdhub.one/better-call-saul-series-2193/"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/123 Safari/537.36"})
          with urllib.request.urlopen(req,timeout=20) as response:
              s=response.read(700000).decode("utf8","replace")
          def simplify(v):
              v=re.sub(r'href\s*=\s*["\x27][^"\x27]*["\x27]', 'href="[redacted]"',v,flags=re.I)
              return " ".join(v.split())[:2500]
          for marker in ['class="episode-download-item','class="season-item','class="episode-number','2160p','S02','Episode-03']:
              at=s.find(marker)
              print("MARKER",marker,"at",at,"near",simplify(s[max(0,at-500):at+2100]),flush=True)
          # all literal UHD snippets (without download URLs) and neighboring section titles
          for m in list(re.finditer("2160p",s,re.I))[:20]:
              print("UHD",simplify(s[max(0,m.start()-350):m.end()+300]),flush=True)

      - name: Count actual 4K and FHD releases for BCS S02
        shell: python
        run: |
          import re,urllib.request,html
          url="https://4khdhub.one/better-call-saul-series-2193/"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/123 Safari/537.36"})
          with urllib.request.urlopen(req,timeout=20) as response:
              body=response.read(700000).decode("utf8","replace")
          split=re.split(r'<div\s+class="season-item episode-item[^"]*"[^>]*>',body)
          print("SEASON BLOCKS",len(split)-1)
          for section in split[1:]:
              match=re.search(r'<div class="episode-number">\s*(S\d+)\s*</div>',section)
              if not match: continue
              season=match.group(1)
              # Stop at the next season block, as separated above
              titles=re.findall(r'<div\s+class="episode-file-title"[^>]*>(.*?)</div>',section,re.S|re.I)
              normalized=[" ".join(html.unescape(re.sub(r'<[^>]*>',' ',t)).split()) for t in titles]
              uhd=[s for s in normalized if re.search(r'\b2160p\b|\b4K\b',s,re.I)]
              fhd=[s for s in normalized if re.search(r'\b1080p\b',s,re.I)]
              print("SEASON",season,"files",len(normalized),"UHD",len(uhd),"FHD",len(fhd),flush=True)
              if season=="S02":
                  for name in normalized[:22]:
                      print("S02 FILE",name[:230],flush=True)

      - name: Probe S02E03 CDN partial content without leaking signed URLs
        shell: python
        run: |
          import re,urllib.request,urllib.error,urllib.parse,html,base64,codecs,json
          def get(url,ref=None,by=240000):
              headers={"User-Agent":"Mozilla/5.0 (Linux; Android 7.1.2) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"}
              if ref: headers["Referer"]=ref
              if by==131072: headers["Range"]="bytes=0-131071"
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=13) as resp:
                  return resp.status,dict(resp.headers),resp.read(by)
          def status(url,ref=None):
              try:
                  code,headers,body=get(url,ref)
                  return (code,headers,body)
              except urllib.error.HTTPError as e:
                  return (e.code,{},e.read(1000))
              except Exception as e:
                  print("NETWORK",type(e).__name__,str(e)[:60],flush=True)
                  return (0,{},b"")
          page="https://4khdhub.one/better-call-saul-series-2193/"
          _,_,raw=get(page,by=900000)
          source=raw.decode("utf8","replace")
          titlepattern=r'<div\s+class="episode-file-title"[^>]*>(.*?)</div>'
          # Real episode cards are self-contained, href is inside the same card.
          cards=re.findall(r'<div class="episode-download-item">(.*?)<div class="episode-links">(.*?)</div>',source,re.S|re.I)
          options=[]
          for titleBlock,linkBlock in cards:
              m=re.search(titlepattern,titleBlock,re.S|re.I)
              if m is None:continue
              title=" ".join(html.unescape(re.sub("<[^>]+>"," ",m.group(1))).split())
              if not re.search(r'\bS02E03\b',title,re.I):continue
              if not re.search(r'\b1080p\b',title,re.I):continue
              if not title.endswith(".mkv"):continue
              for url,label in re.findall(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',linkBlock,re.S|re.I):
                  if 'HubCloud' in label:
                      options.append((title,html.unescape(url)))
          print("BCS S02E03 live FHD HubCloud gateways",len(options),flush=True)
          for title,gateway in options[:2]:
              try:
                  code,_,gb=get(gateway,by=100000)
                  print("gateway HTTP",code,flush=True)
                  match=re.search(r"s\(['\x22]o['\x22],\s*['\x22]([A-Za-z0-9+/=]+)['\x22]",gb.decode("utf8","replace"))
                  if not match:
                      print("gateway no encoded target",flush=True);continue
                  layer=base64.b64decode(base64.b64decode(match.group(1))).decode("utf8","replace")
                  obj=base64.b64decode(codecs.decode(layer,"rot_13")).decode("utf8","replace")
                  hub=base64.b64decode(json.loads(obj)["o"]).decode("utf8","replace")
                  if urllib.parse.urlparse(hub).hostname not in ["hubcloud.ist","hubdrive.ist"]:
                      print("unexpected hub",flush=True);continue
                  code,_,hubhtml=get(hub,by=160000)
                  print("hub HTTP",code,flush=True)
                  m=re.search(r"var\s+url\s*=\s*['\x22]([^'\x22]+)['\x22]",hubhtml.decode("utf8","replace"))
                  if not m:continue
                  filepage=m.group(1)
                  if urllib.parse.urlparse(filepage).hostname not in ["gamerxyt.com","hubcloud.ist","hubdrive.ist"]:
                      print("unexpected file page",flush=True);continue
                  code,_,filehtml=get(filepage,ref=hub,by=130000)
                  print("file page HTTP",code,flush=True)
                  links=re.findall(r'href="(https://[^"]+)"',filehtml.decode("utf8","replace"),re.I)
                  media=[html.unescape(u) for u in links if any(urllib.parse.urlparse(u).hostname or '' in ('') for _ in [0])] if False else []
                  for u in links:
                      host=urllib.parse.urlparse(u).hostname or ''
                      if host.endswith((".workers.dev",".r2.dev",".cloudflarestorage.com")):
                          media.append(html.unescape(u))
                  print("signed media candidates",len(media),flush=True)
                  import collections
                  allanchors=re.findall('href="([^"]+)"',filehtml.decode("utf8","replace"),re.I) + re.findall("href='([^']+)'",filehtml.decode("utf8","replace"),re.I)
                  hoststats=collections.Counter()
                  for link in allanchors:
                      x=urllib.parse.urlparse(html.unescape(link))
                      hoststats[x.hostname or "relative"]+=1
                      if x.hostname: print("FILEPAGE LINK HOST",x.hostname,"extension",x.path[-10:],flush=True)
                  print("FILEPAGE HOST COUNTS",dict(hoststats),flush=True)
                  for link in allanchors:
                      parsed=urllib.parse.urlparse(html.unescape(link))
                      if parsed.hostname not in ("pixeldrain.dev","pixeldrain.com"):continue
                      m=re.fullmatch("/u/([A-Za-z0-9_-]{4,30})",parsed.path)
                      if not m:continue
                      print("PIXELDRAIN FILE ID PRESENT",len(m.group(1)),flush=True)
                      for domain in ["pixeldrain.dev","pixeldrain.com"]:
                          direct="https://"+domain+"/api/file/"+m.group(1)
                          try:
                              code,headers,prefix=get(direct,by=131072)
                              print("PIXELDRAIN API",domain,code,
                                    "mime",headers.get("Content-Type",""),
                                    "range",headers.get("Content-Range","")[:45],
                                    "bytes",len(prefix),
                                    "ebml",prefix.startswith(bytes([26,69,223,163])),
                                    flush=True)
                          except urllib.error.HTTPError as e:
                              print("PIXELDRAIN API",domain,e.code,flush=True)
                          except Exception as e:
                              print("PIXELDRAIN API",domain,type(e).__name__,str(e)[:60],flush=True)
                      break

                  filest=filehtml.decode("utf8","replace")
                  tt=re.search(r'<title[^>]*>(.*?)</title>',filest,re.S|re.I)
                  print("FILEPAGE", "html bytes",len(filest),
                        "title", (" ".join(tt.group(1).split())[:85] if tt else ""),
                        "cloudflare",filest.lower().count("cloudflare"),
                        "download",filest.lower().count("download"),
                        "gdrive",filest.lower().count("gdrive"),
                        "gamerx",filest.lower().count("gamerx"),
                        "javascript",filest.lower().count("javascript"),
                        "anchor",filest.lower().count("<a "),flush=True)
                  print("FILEPAGE FIRST NONLINK TEXT",
                        " ".join(re.sub(r'<[^>]*>',' ',filest[:4000]).split())[:370],flush=True)
                  for direct in media[:1]:
                      try:
                          code,headers,prefix=get(direct,ref=filepage,by=131072)
                          print("CDN",code,"range",headers.get("Content-Range","")[:30],
                                "bytes",len(prefix),"EBML",prefix[:4]==b"\x1a\x45\xdf\xa3",
                                "video codec",("V_MPEGH/ISO/HEVC" in prefix.decode("latin1") or "V_MPEG4/ISO/AVC" in prefix.decode("latin1")),
                                "eng language",("eng" in prefix.decode("latin1")),flush=True)
                      except Exception as e:
                          print("CDN fetch",type(e).__name__,str(e)[:80],flush=True)
              except Exception as e:
                  print("gateway exception",type(e).__name__,str(e)[:100],flush=True)
