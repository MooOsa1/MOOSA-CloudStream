name: MOOSA managed FHD HTTP addon reality check
on:
  push:
    branches: [experiment/fhd-managed-addon-audit-20261017]
    paths:
      - 'MOOSAWeb/tools/managed-fhd-addons-audit.mjs'
      - 'MOOSAWeb/tools/managed-fhd-browser-sintel.mjs'
      - 'MOOSAWeb/tools/managed-noads-embed-audit.mjs'
      - 'MOOSAWeb/tools/managed-noads-browser-audit.mjs'
      - 'MOOSAWeb/tools/ezvidapi-direct-fhd-audit.mjs'
      - 'MOOSAWeb/tools/managed-fhd-embed-audit.mjs'
      - '.github/workflows/moosa-managed-fhd-addons.yml'
  pull_request:
    branches: [main]
    paths:
      - 'MOOSAWeb/tools/managed-fhd-addons-audit.mjs'
      - 'MOOSAWeb/tools/managed-fhd-browser-sintel.mjs'
      - 'MOOSAWeb/tools/managed-noads-embed-audit.mjs'
      - 'MOOSAWeb/tools/managed-noads-browser-audit.mjs'
      - 'MOOSAWeb/tools/ezvidapi-direct-fhd-audit.mjs'
      - '.github/workflows/moosa-managed-fhd-addons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent Node audit syntax
        run: node --check MOOSAWeb/tools/managed-fhd-addons-audit.mjs
      - name: Audit auto-updated hosted iframe playback metadata (no video downloaded)
        run: |
          node --check MOOSAWeb/tools/managed-fhd-embed-audit.mjs
          node MOOSAWeb/tools/managed-fhd-embed-audit.mjs
      - name: Verify advertised direct HLS API against licensed Sintel ID (metadata only)
        run: |
          node --check MOOSAWeb/tools/ezvidapi-direct-fhd-audit.mjs
          node MOOSAWeb/tools/ezvidapi-direct-fhd-audit.mjs
      - name: Read-only zero-ad provider markup and iframe policy check
        run: |
          node --check MOOSAWeb/tools/managed-noads-embed-audit.mjs
          node MOOSAWeb/tools/managed-noads-embed-audit.mjs
      - name: Query current third-party manifests and stream metadata (no video downloaded)
        run: node MOOSAWeb/tools/managed-fhd-addons-audit.mjs

  licensed-fhd-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser script syntax and available Chrome
        run: |
          node --check MOOSAWeb/tools/managed-fhd-browser-sintel.mjs
          command -v google-chrome || command -v google-chrome-stable
      - name: Install small Chrome control client (Chrome is preinstalled on runner)
        run: npm install --no-audit --no-fund --prefix /tmp/moosa-browser puppeteer-core@24.24.0
      - name: Check decoded frame of freely licensed Sintel in real Chrome
        run: timeout 65 node MOOSAWeb/tools/managed-fhd-browser-sintel.mjs
      - name: Inspect fixed licensed Sintel hosted embed in sandboxed Chrome
        run: |
          node --check MOOSAWeb/tools/managed-noads-browser-audit.mjs
          timeout 75 node MOOSAWeb/tools/managed-noads-browser-audit.mjs
