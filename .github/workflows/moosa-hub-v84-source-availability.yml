name: Inspect alternate public subtitle endpoints (read only)
on:
  push:
    branches: ["investigate/v84-subtitle-catalog-coverage"]
  workflow_dispatch:
jobs:
  test-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compare reachable subtitle sources and Arabic results
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time,base64
          headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"}
          movies=["tt0111161","tt0816692"]
          for imdb in movies:
            legacy_payload={"id":1,"jsonrpc":"2.0","method":"subtitles.find","params":[None,{"query":{"itemHash":imdb}}]}
            encoded=base64.b64encode(json.dumps(legacy_payload,separators=(",",":")).encode()).decode()
            urls={
              "v3":"https://opensubtitles-v3.strem.io/subtitles/movie/"+imdb+".json",
              "legacy-stremio":"https://opensubtitles.strem.io/subtitles/movie/"+imdb+".json",
              "legacy-rpc":"https://opensubtitles.strem.io/stremio/v1/q.json?b="+encoded,
              "subsense":"https://subsense.nepiraw.com/subtitles/movie/"+imdb+".json",
              "subsource-old-search":"https://api.subsource.net/v1/movie/search",
              "subsource-v1":"https://api.subsource.net/api/v1/subtitles?imdb_id="+imdb,
            }
            for label,url in urls.items():
              try:
                if label=="subsource-old-search":
                  payload=json.dumps({"query":imdb,"includeSeasons":False,"limit":4,"signal":"{}"}).encode()
                  request=urllib.request.Request(url,data=payload,headers={**headers,"Content-Type":"application/json"})
                else:
                  request=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(request,timeout=12) as response:
                  payload=response.read(300000)
                  status=response.status
                  content_type=response.headers.get("content-type","")
                try:jsonval=json.loads(payload)
                except ValueError:jsonval={}
                subs=jsonval.get("subtitles") if isinstance(jsonval,dict) else None
                if subs is None and isinstance(jsonval,dict):
                  subs=(jsonval.get("result") or {}).get("all",[]) if isinstance(jsonval.get("result"),dict) else []
                if subs is None:subs=[]
                langs={}
                for row in subs:
                  if isinstance(row,dict):
                    lang=row.get("lang","?");langs[lang]=langs.get(lang,0)+1
                print("PROBE",imdb,label,"status",status,"type",content_type[:40],"count",len(subs),"ara",langs.get("ara",0)+langs.get("ar",0),"en",langs.get("eng",0)+langs.get("en",0),"keys",list(jsonval)[:8] if isinstance(jsonval,dict) else "LIST","sample",str(jsonval)[:180] if not subs else "",flush=True)
              except Exception as e:
                print("PROBE",imdb,label,"ERROR",type(e).__name__,getattr(e,"code",""),str(e)[:120],flush=True)
          PY
