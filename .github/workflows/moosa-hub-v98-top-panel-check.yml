name: Validate MOOSA Hub v98 top filters and TV compatibility
on:
  push:
    branches: ["feat/moosa-hub-v98-top-panel-chips"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Compile both plugins and produce manifest
        run: gradle :MOOSAHub:make :MOOSAArabic:make makePluginsJson ensureJarCompatibility
      - name: Guard compact dropdown, chips, remote focus and stable backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          main=Path('MOOSAHub/src/main/kotlin/com/moosa/hub')
          dialog=(main/'MOOSABrowseDialog.kt').read_text()
          catalog=(main/'MOOSACatalog.kt').read_text()
          filters=(main/'MOOSABrowseFilters.kt').read_text()
          versions={i['internalName']:i['version'] for i in json.loads(Path('build/plugins.json').read_text())}
          assert versions=={'MOOSAHub':98,'MOOSAArabic':3},versions

          required=[
            'private lateinit var filterToggleButton: Button',
            'private lateinit var filterPanel: LinearLayout',
            'private lateinit var filtersScrim: View',
            'private lateinit var chipsRow: LinearLayout',
            'private lateinit var showResultsButton: Button',
            'private var draftFilters: MOOSABrowseFilters.Selection? = null',
            'private fun setFilterPanelVisible(open: Boolean, focusResults: Boolean = false)',
            'filterToggleButton.setOnClickListener { setFilterPanelVisible(!filterPanelVisible) }',
            'setContentView(container)',
            'val chipScroller = HorizontalScrollView(context)',
            'if (labels == lastRenderedChips) return',
            'chipsRow.removeAllViews()',
            'filterPanel.addView(filterRow(typeButton, genreButton)',
            'filterPanel.addView(filterRow(sortButton, countryButton)',
            'filterPanel.addView(filterRow(resetButton, showResultsButton)',
            'filterPanel.animate().alpha(1f).translationY(0f)',
            '.setDuration(260L).setInterpolator(DecelerateInterpolator())',
            'filtersScrim.animate().alpha(0f).setDuration(190L)',
            'if (filterPanelVisible) setFilterPanelVisible(false)',
            'draftFilters = current.copy(sort = options[which].apiSort)',
            'draftFilters = current.copy(originCountry = options[which].code)',
            'draftFilters = MOOSABrowseFilters.withType(current, which == 1)',
            'draftFilters = null',
            'val change = draftFilters != selectedFilters',
            'if (change) applyFilters(draftFilters)',
            'setFilterPanelVisible(false, focusResults = true)',
            'val applied = selectedFilters',
            'val current = draft ?: MOOSABrowseFilters.initial(request)',
            'typeButton.nextFocusDownId = sortButton.id',
            'showResultsButton.nextFocusLeftId = resetButton.id',
            'filterToggleButton.setOnKeyListener',
            'focusFirstVisiblePoster()',
            'browseJob?.cancel(CancellationException("Show More filters changed"))',
            'browseJob?.cancel(CancellationException("Show More dialog destroyed"))',
            'browseSnapshots.size > 6',
            'savedAtMs < 120_000L',
            'val effectiveRequest = selectedRequest()',
            'request = effectiveRequest',
          ]
          for token in required: assert token in dialog,token
          assert 'root.addView(filterRow(' not in dialog, 'Filter controls must overlay posters, not consume rows'
          assert dialog.count('request = effectiveRequest')==2
          assert 'browseJob?.cancel()' not in dialog
          assert 'data = "/discover/$type?$query"' in filters
          assert 'params["with_genres"] = it.toString()' in filters
          assert 'params["with_origin_country"] = choice.originCountry' in filters
          assert 'MOOSACatalog.browseBatch(' in dialog
          assert 'MOOSASeeAll.register(' in catalog
          # Regression check of method absent on older Android CloudStream.
          compiled=list(Path('MOOSAHub/build').rglob('MOOSABrowseDialog*.class'))
          assert compiled,'No compiled browse-dialog classes'
          assert not any(b'cancel$default' in cls.read_bytes() for cls in compiled)
          print('PASS: v98 compiles, compact top panel and chips, draft-only selections, stable TMDB requests and compatible bytecode')
          PY
