name: CloudStream Web Bridge Android compile
on:
  push:
    branches:
      - feature/cloudstream-web-bridge
    paths:
      - 'MOOSAHub/**'
      - '.github/workflows/moosa-web-bridge-android.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Compile both extension artifacts without publishing
        run: gradle make
