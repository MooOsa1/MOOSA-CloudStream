name: Probe MOOSA Hub subtitle sources (read only)
on:
  push:
    branches: ["fix/moosa-hub-v80-restore-subtitles"]
  workflow_dispatch:
jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual Stremio subtitle index and files
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,re,concurrent.futures,time
          films=[("matrix","movie","tt0133093"),("interstellar","movie","tt0816692"),("series","series","tt0944947:1:1")]
          def req(url,limit=32768,range_mode=False):
            h={"User-Agent":"Mozilla/5.0 MOOSA subtitle validation","Accept":"application/json,text/vtt,text/plain,*/*"}
            if range_mode:h["Range"]="bytes=0-32767"
            start=time.monotonic()
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=15) as r:
                data=r.read(limit)
                return (r.status,r.headers.get("Content-Type",""),data,round(time.monotonic()-start,2),r.geturl())
            except Exception as e:return (type(e).__name__,"",str(e).encode(),round(time.monotonic()-start,2),url)
          for title,typ,ident in films:
            url=f"https://opensubtitles-v3.strem.io/subtitles/{typ}/{ident}.json"
            status,kind,b,t,final=req(url,300000)
            print("INDEX",title,"status",status,"type",kind,"bytes",len(b),"time",t,flush=True)
            try: subs=json.loads(b).get("subtitles",[])
            except Exception as e:
              print("INDEX_ERROR",title,str(e)[:180],flush=True)
              continue
            counts={}
            for s in subs:counts[s.get("lang")]=counts.get(s.get("lang"),0)+1
            print("LANGS",title,len(subs),{k:v for k,v in counts.items() if k in ("ara","ar","eng","en")},flush=True)
            for lang in ("ara","eng"):
              candidate=next((s for s in subs if s.get("lang")==lang and s.get("url","").startswith("https://")),None)
              if not candidate:
                print("MISSING",title,lang,flush=True);continue
              code,ctype,data,t,final=req(candidate["url"],32768,True)
              decoded=data.decode("utf-8",errors="replace")
              timing=bool(re.search(r"(?:\d{1,2}:)?\d{2}:\d{2}[,.]\d{1,3}\s*-->\s*(?:\d{1,2}:)?\d{2}:\d{2}[,.]\d{1,3}",decoded))
              arab=sum("\u0600"<=c<="\u06ff" for c in decoded)
              latin=sum(("A"<=c<="Z") or ("a"<=c<="z") for c in decoded)
              print("FILE",title,lang,"status",code,"content_type",ctype,"len",len(data),"time",t,"timing",timing,"arab_chars",arab,"latin_chars",latin,"replacement",decoded.count("\ufffd"),"nullbytes",data.count(bytes([0])),"redirect_host",urllib.request.urlparse(final).hostname,flush=True)
          PY
