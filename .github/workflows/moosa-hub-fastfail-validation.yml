name: MOOSA Hub failed-server fast-fail validation

on:
  push:
    branches:
      - fix/moosa-hub-failed-server-probes-20261019
    paths:
      - 'MOOSAHub/**'
      - '.github/workflows/moosa-hub-fastfail-validation.yml'
  pull_request:
    paths:
      - 'MOOSAHub/**'
      - '.github/workflows/moosa-hub-fastfail-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Verify Kotlin progress and retry policies independently of JitPack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/moosa-jvm/src/main/kotlin/com/moosa/hub"
          mkdir -p "$RUNNER_TEMP/moosa-jvm/src/test/kotlin/com/moosa/hub"
          cp MOOSAHub/src/main/kotlin/com/moosa/hub/MOOSALinkRetryPolicy.kt "$RUNNER_TEMP/moosa-jvm/src/main/kotlin/com/moosa/hub/"
          cp MOOSAHub/src/main/kotlin/com/moosa/hub/MOOSAProgressVisibilityPolicy.kt "$RUNNER_TEMP/moosa-jvm/src/main/kotlin/com/moosa/hub/"
          cp MOOSAHub/src/test/kotlin/com/moosa/hub/MOOSALinkRetryPolicyTest.kt "$RUNNER_TEMP/moosa-jvm/src/test/kotlin/com/moosa/hub/"
          cp MOOSAHub/src/test/kotlin/com/moosa/hub/MOOSAProgressVisibilityPolicyTest.kt "$RUNNER_TEMP/moosa-jvm/src/test/kotlin/com/moosa/hub/"
          cat > "$RUNNER_TEMP/moosa-jvm/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { gradlePluginPortal(); mavenCentral() } }
          rootProject.name = "MOOSAPolicyTests"
          EOF
          cat > "$RUNNER_TEMP/moosa-jvm/build.gradle.kts" <<'EOF'
          plugins { kotlin("jvm") version "2.3.0" }
          repositories { mavenCentral() }
          dependencies { testImplementation("junit:junit:4.13.2") }
          tasks.test { useJUnit() }
          EOF
          gradle --project-dir "$RUNNER_TEMP/moosa-jvm" test --no-daemon --console=plain
      - name: Run actual MOOSA Hub plugin unit tests
        run: gradle :MOOSAHub:testReleaseUnitTest --no-daemon
      - name: Build CloudStream plugins without publishing
        run: gradle make --no-daemon
      - name: Upload isolated MOOSA Hub test package (NOT published)
        uses: actions/upload-artifact@v4
        with:
          name: MOOSAHub-Server-Progress-Test
          path: MOOSAHub/build/MOOSAHub.cs3
          if-no-files-found: error
          retention-days: 7
      - name: Confirm 720p floor and existing two-plugin arrangement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          policy = Path('MOOSAHub/src/main/kotlin/com/moosa/hub/MOOSAQualityPolicy.kt').read_text()
          registry = Path('MOOSAHub/src/main/kotlin/com/moosa/hub/MOOSAServerRegistry.kt').read_text()
          settings = Path('settings.gradle.kts').read_text()
          assert 'const val MIN_HEIGHT = 720' in policy
          assert 'MOOSALinkRetryPolicy.shouldRetry(first.reason)' in registry
          assert 'include("MOOSAHub")' in settings and 'include("MOOSAArabic")' in settings
          print('HD floor, fail-fast integration and both original plugins preserved')
          PY
