name: MOOSA JVM pilot Render Free extraction proof
on:
  push:
    branches: [experiment/render-free-cs-jvm-sidecar-20261017]
    paths:
      - '.github/workflows/moosa-jvm-render-free-live-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Render JVM extraction results without obtaining any media URL
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const url='https://moosa-jvm-pilot.onrender.com/healthz';
          let last;
          for(let n=1;n<=37;n++){
            try{
              const res=await fetch(url,{
                signal:AbortSignal.timeout(10000),redirect:'error',
                headers:{Accept:'application/json'}});
              assert.equal(res.status,200);
              last=await res.json();
              console.log('MOOSA_RENDER_ORIGINAL_JVM '+JSON.stringify({
                attempt:n,health:last.status,
                probe:last.extractionProbe,
                distributionEnabled:last.distributionEnabled}));
              if(last.extractionProbe?.state==='complete')break;
            }catch(e){
              console.log('MOOSA_RENDER_BOOT_PENDING '+JSON.stringify({
                attempt:n,error:String(e.name||'network').slice(0,65)}));
            }
            if(n<37)await wait(7000);
          }
          assert.equal(last?.status,'ok');
          assert.equal(last.distributionEnabled,false);
          assert.equal(last.extractionProbe?.state,'complete',
            'Real Render JVM extraction has not completed');
          assert.equal(last.extractionProbe.result,'original_callbacks_returned',
            'Original provider did not successfully extract on Render Free');
          assert.ok(last.extractionProbe.candidateCount>0,
            'No original CineStream URLs extracted in Render container');
          console.log('MOOSA_RENDER_ORIGINAL_JVM_RESOLVE_PROVEN=true');
          JS
