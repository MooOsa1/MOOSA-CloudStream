name: MOOSA Commons Mobile UI
on:
  push:
    branches: [feature/free-commons-stream-provider]
    paths:
      - 'MOOSAWeb/public/**'
      - 'MOOSAWeb/tests/free-film-browser.e2e.mjs'
      - '.github/workflows/commons-mobile-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: MOOSAWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test licensed-source player controls and attribution
        run: node tests/free-film-browser.e2e.mjs
