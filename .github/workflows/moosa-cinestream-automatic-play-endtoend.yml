name: MOOSA Play button to real CineStream backend Chrome end-to-end
on:
  pull_request:
    branches: [main]
    paths:
      - 'MOOSAWeb/tests/cinestream-automatic-play-endtoend.e2e.mjs'
      - '.github/workflows/moosa-cinestream-automatic-play-endtoend.yml'
      - 'MOOSAWeb/server.mjs'
      - 'MOOSAWeb/vidlink-multifilm-candidates.mjs'
      - 'MOOSAWeb/public/source-search.js'
      - 'MOOSAWeb/public/player.js'
      - 'MOOSAWeb/public/playback-fallback.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-play-to-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual Chrome browser for real UI, not mocks
        run: |
          cd MOOSAWeb
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chrome
      - name: Start from Play search and decode fallback through real Node backend
        timeout-minutes: 7
        run: cd MOOSAWeb && node tests/cinestream-automatic-play-endtoend.e2e.mjs
