name: Validate MOOSA Hub v80 subtitle restoration (no release)
on:
  push:
    branches: ["fix/moosa-hub-v80-restore-subtitles"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  subtitle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build both plugins
        run: gradle :MOOSAHub:make :MOOSAArabic:make makePluginsJson ensureJarCompatibility
      - name: Validate only Arabic and English with reliable subtitle fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          base=Path("MOOSAHub/src/main/kotlin/com/moosa/hub/")
          p=(base/"MOOSAHubProvider.kt").read_text()
          versions={x["internalName"]:x["version"] for x in json.loads(Path("build/plugins.json").read_text())}
          assert versions.get("MOOSAHub",0)>=80 and versions.get("MOOSAArabic")==3,versions
          assert "private val subtitleTimeoutMs = 5200L" in p
          assert "fastSubtitleTimeoutMs" not in p
          assert "return timed(4500L)" in p
          assert "sub.wyzie.io/search" in p and "sub.wyzie.ru/search" not in p
          assert "https://opensubtitles-v3.strem.io/subtitles/" in p
          assert "byLanguage[PreferredSubtitleLanguage.ARABIC].orEmpty().take(" in p
          assert "byLanguage[PreferredSubtitleLanguage.ENGLISH].orEmpty().take(" in p
          assert "fetchExternalSubtitles(request) {" in p or "filterReadableSubtitles(fetchExternalSubtitles(request))" in p
          assert "filterReadableSubtitles(nativeSubtitles.toList()" in p
          assert "body.count { it == '\\uFFFD' } > 4" in p
          assert "subtitleTiming.containsMatchIn(body)" in p
          assert "PreferredSubtitleLanguage.OTHER -> null" in p
          assert 'PreferredSubtitleLanguage.ARABIC -> "Arabic"' in p
          assert 'PreferredSubtitleLanguage.ENGLISH -> "English"' in p
          assert "MOOSAArabic" not in str(versions.get("MOOSAHub"))
          print("PASS: v80 source rules, bounded verified fallback, parallel subtitle retrieval")
          PY
      - name: Probe live Arabic and English tracks and content
        run: |
          python3 - <<'PY'
          import json,urllib.request,re
          cases=[("movie","tt0816692"),("series","tt0944947:1:1")]
          for typ,mid in cases:
              api=f"https://opensubtitles-v3.strem.io/subtitles/{typ}/{mid}.json"
              with urllib.request.urlopen(urllib.request.Request(api,headers={"User-Agent":"Mozilla/5.0"}),timeout=14) as r:
                  subtitles=json.load(r)["subtitles"]
              print("CASE",typ,"RESULTS",len(subtitles),flush=True)
              for lang in ("ara","eng"):
                  sources=[s.get("url","") for s in subtitles if s.get("lang")==lang and s.get("url","").startswith("https://")]
                  assert sources,f"{typ} missing {lang}"
                  valid=False
                  for url in sources[:4]:
                      try:
                          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Range":"bytes=0-32767"})
                          with urllib.request.urlopen(req,timeout=12) as r:
                              data=r.read(32768)
                          text=data.decode("utf-8",errors="replace")
                          timing=bool(re.search(r"(?:\d{1,2}:)?\d{2}:\d{2}[,.]\d{1,3}\s*-->\s*(?:\d{1,2}:)?\d{2}:\d{2}[,.]\d{1,3}",text))
                          letters=sum('\u0600'<=c<='\u06ff' for c in text) if lang=="ara" else sum('a'<=c.lower()<='z' for c in text)
                          if timing and letters>=12 and text.count('\ufffd')<=4:
                              valid=True
                              break
                      except Exception as e:
                          print("CDN_RETRY",typ,lang,type(e).__name__,flush=True)
                  print("TRACK",typ,lang,"verified",valid,flush=True)
                  assert valid,f"No valid {lang} subtitle for {typ}"
          print("PASS: public subtitle index and real content includes verified Arabic and English")
          PY
