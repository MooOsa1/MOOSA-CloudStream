name: MOOSA Web browser source fallback
on:
  pull_request:
    paths:
      - 'MOOSAWeb/public/player.js'
      - 'MOOSAWeb/public/playback-fallback.js'
      - 'MOOSAWeb/tests/player-fallback.e2e.mjs'
      - '.github/workflows/moosa-web-source-fallback.yml'
  push:
    branches: [main]
    paths:
      - 'MOOSAWeb/public/player.js'
      - 'MOOSAWeb/public/playback-fallback.js'
      - 'MOOSAWeb/tests/player-fallback.e2e.mjs'
      - '.github/workflows/moosa-web-source-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: MOOSAWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/player-fallback.e2e.mjs
