name: Check original CloudStream extension JVM linkage
on:
  push:
    branches: [main]
    paths:
      - 'MOOSAWeb/tools/JvmCs3ClassProbe.java'
      - '.github/workflows/moosa-web-jvm-cs3-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cs3-jvm-link-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jvm-linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download upstream archives and official dex2jar v2.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          urls = {
            'CineStream.cs3': 'https://raw.githubusercontent.com/SaurabhKaperwan/CSX/builds/CineStream.cs3',
            'StreamPlay.cs3': 'https://raw.githubusercontent.com/phisher98/cloudstream-extensions-phisher/builds/StreamPlay.cs3',
            'dex2jar.zip': 'https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip',
          }
          folder = Path('/tmp/cs3-jvm')
          folder.mkdir(parents=True, exist_ok=True)
          for name, url in urls.items():
            limit = 25_000_000 if name.endswith('.zip') else 8_000_000
            with urlopen(Request(url, headers={'User-Agent': 'MOOSAWeb-JVM-Probe'}), timeout=35) as response:
              content = response.read(limit + 1)
            if len(content) > limit:
              raise RuntimeError(name + ' exceeds maximum size')
            (folder / name).write_bytes(content)
            print(name + ': ' + str(len(content)) + ' bytes')
          PY
      - name: Convert actual CineStream methods and only StreamPlay class signatures
        run: |
          set -euo pipefail
          cd /tmp/cs3-jvm
          mkdir -p cine stream converter
          unzip -q CineStream.cs3 classes.dex -d cine
          unzip -q StreamPlay.cs3 classes.dex -d stream
          unzip -q dex2jar.zip -d converter
          DEX2JAR="$(find converter -name d2j-dex2jar.sh -type f -print -quit)"
          test -n "$DEX2JAR"
          chmod +x "$DEX2JAR"
          "$DEX2JAR" --force --output CineStream.jar cine/classes.dex
          echo 'CINESTREAM_FULL_METHODS_CONVERTED'
          echo 'Original StreamPlay full conversion previously failed even with 4 GiB heap'
          echo 'Inspecting ONLY StreamPlay class signatures; NOT executable method code'
          java -Xmx2g -cp "converter/dex-tools-v2.4/lib/*" com.googlecode.dex2jar.tools.Dex2jarCmd --no-code --force --output StreamPlay.jar stream/classes.dex
          echo 'STREAMPLAY_CLASS_SIGNATURES_ONLY'
          ls -lh CineStream.jar StreamPlay.jar
          jar tf CineStream.jar | grep -F 'com/megix/CineStream.class'
          jar tf StreamPlay.jar | grep -F 'com/phisher98/StreamPlayPlugin.class'
      - name: Load original entry class signatures on standard JVM without Android
        run: |
          set -euo pipefail
          javac -d /tmp/cs3-jvm MOOSAWeb/tools/JvmCs3ClassProbe.java
          java -cp /tmp/cs3-jvm JvmCs3ClassProbe CineStream /tmp/cs3-jvm/CineStream.jar com.megix.CineStream
          java -cp /tmp/cs3-jvm JvmCs3ClassProbe StreamPlay /tmp/cs3-jvm/StreamPlay.jar com.phisher98.StreamPlayPlugin
          echo 'No downloaded extension bytecode was executed'
