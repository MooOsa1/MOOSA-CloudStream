name: CloudStream host-to-Android API integration probe
on:
  push:
    branches: [experiment/cloudstream-loopback-api]
    paths:
      - 'MOOSAProbe/**'
      - 'settings.gradle.kts'
      - 'tests/cloudstream-full-probe.sh'
      - '.github/workflows/cloudstream-full-probe.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build private test extension only; do not publish
        run: |
          MOOSA_ENABLE_PROBE=1 gradle :MOOSAProbe:make --no-daemon --stacktrace
          ls -la MOOSAProbe/build/
      - name: Accelerate ephemeral Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove authenticated host-to-Android CloudStream test API
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 3072M
          disk-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: bash tests/cloudstream-full-probe.sh
      - name: Preserve private execution diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudstream-loopback-api-probe
          path: probe-evidence/
          if-no-files-found: warn
          retention-days: 4
