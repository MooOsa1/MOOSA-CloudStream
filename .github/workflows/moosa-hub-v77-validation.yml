name: Validate MOOSA Hub v77 Indian ranking and Arabic descriptions (no release)
on:
  push:
    branches: ["fix/moosa-hub-v77-indian-ranking-arabic-plots"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Compile and check both plugins
        run: gradle :MOOSAHub:make :MOOSAArabic:make makePluginsJson ensureJarCompatibility
      - name: Verify no unrelated catalog or provider changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          b=Path("MOOSAHub/src/main/kotlin/com/moosa/hub")
          catalog=(b/"MOOSACatalog.kt").read_text()
          provider=(b/"MOOSAHubProvider.kt").read_text()
          versions={p["internalName"]:p["version"] for p in json.loads(Path("build/plugins.json").read_text())}
          assert versions=={"MOOSAHub":77,"MOOSAArabic":3},versions
          assert "with_origin_country=IN&sort_by=vote_average.desc&vote_count.gte=200&vote_average.gte=7" in catalog
          assert "val pagesPerBatch = if (request.name == \"Top Indian Movies\") 3" in catalog
          assert "if (indianTop) item else enrichArtwork(item, forceTv)" in catalog
          assert "https://translate.googleapis.com/translate_a/single" in provider
          assert "https://api.mymemory.translated.net/get" in provider
          assert "val label = if (focused) \"SHOW MORE  ›\" else \"›\"" in (b/"MOOSASeeAll.kt").read_text()
          assert "translateSynopsisExternally(english)" in provider
          assert 'base.plot = arabicOverview' in provider
          assert 'base.plot = cleanSynopsis(base.plot)' not in provider
          assert "synopsisCache[cacheKey] = result" not in provider
          print("PASS: fixed Indian rating floor; actual Arabic fallback without touching titles/TV focus")
          PY
      - name: Live read-only catalogue and translation probes
        run: |
          python3 - <<'PY'
          import urllib.parse as p
          import urllib.request as u
          import json,re
          from pathlib import Path
          source=Path("MOOSAHub/src/main/kotlin/com/moosa/hub/MOOSACatalog.kt").read_text()
          key=re.search(r'private const val TMDB_KEY = "([^"]+)"',source).group(1)
          opts={"api_key":key,"language":"en-US","include_adult":"false",
                "with_origin_country":"IN","sort_by":"vote_average.desc",
                "vote_count.gte":"200","vote_average.gte":"7","page":"1"}
          url="https://api.themoviedb.org/3/discover/movie?"+p.urlencode(opts)
          try:
            req=u.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            with u.urlopen(req, timeout=14) as handle: response=json.load(handle)
            items=response["results"]
            assert len(items)>=8, "unexpectedly few Indian movies"
            assert all(x["vote_count"]>=200 and x["vote_average"]>=7 for x in items)
            assert all(items[i]["vote_average"] >= items[i+1]["vote_average"] for i in range(len(items)-1))
            print("INDIAN_TOP", "found",response.get("total_results"),"page_titles", [(x.get("title"),x.get("vote_average"),x.get("vote_count")) for x in items[:7]])
          except Exception as e:
            print("TMDB_PROBE_UNAVAILABLE",str(e)[:180])
          params={"client":"gtx","sl":"en","tl":"ar","dt":"t",
                  "q":"A young scientist searches for a lost city and meets an old friend."}
          try:
            url="https://translate.googleapis.com/translate_a/single?"+p.urlencode(params)
            req=u.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            with u.urlopen(req, timeout=12) as handle: translations=json.load(handle)
            translated="".join(s[0] for s in translations[0] if s and s[0])
            assert sum('\u0600'<=c<='\u06FF' for c in translated)>10,translated
            print("TRANSLATION_PROBE_OK",translated[:120])
          except Exception as e:
            print("TRANSLATION_PROBE_UNAVAILABLE",str(e)[:180])
          PY
