name: Probe v83 subtitle release metadata and working alternates (read only)
on:
  push:
    branches: ["fix/moosa-hub-v83-subtitle-variants"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch metadata only, do not download videos
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,json,time
          def read(url):
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=12) as r:
                body=r.read(1000000)
                return r.status,json.loads(body)
            except Exception as e:return type(e).__name__,{}
          samples=[("Interstellar","tt0816692"),("Shawshank","tt0111161")]
          for title,imdb in samples:
            code,data=read(f"https://opensubtitles-v3.strem.io/subtitles/movie/{imdb}.json")
            subtitles=data.get("subtitles",[])
            print("V3",title,"code",code,"count",len(subtitles),flush=True)
            for lang in ("ara","eng"):
              found=[x for x in subtitles if x.get("lang")==lang]
              print("V3_LANG",title,lang,"count",len(found),"metadata_keys",list(found[0]) if found else [],"id_sample",[x.get("id","")[:120] for x in found[:2]],flush=True)
            num=imdb.removeprefix("tt").lstrip("0")
            url=f"https://rest.opensubtitles.org/search/imdbid-{num}/sublanguageid-ara"
            code,data=read(url)
            if isinstance(data,list):
              print("REST",title,"code",code,"count",len(data),"release_samples",[x.get("MovieReleaseName","")[:90] for x in data[:4]],flush=True)
            else:print("REST",title,"code",code,"shape",type(data).__name__,flush=True)
          PY
