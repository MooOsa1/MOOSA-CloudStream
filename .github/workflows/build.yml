name: Build CloudStream plugins

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Website-only updates must not compile and republish Android .cs3 files.
    # Keep manual workflow_dispatch available to rebuild when requested.
    paths:
      - 'MOOSAHub/**'
      - 'MOOSAArabic/**'
      - 'MOOSAProbe/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'repo.json'
      - '.github/workflows/build.yml'

concurrency:
  group: cloudstream-build-v7
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          gradle make makePluginsJson
          gradle ensureJarCompatibility
          python3 - <<'PY'
          import json
          from pathlib import Path
          allowed = {"MOOSAHub", "MOOSAArabic"}
          plugins = json.loads(Path("build/plugins.json").read_text())
          names = [plugin["internalName"] for plugin in plugins]
          assert len(names) == len(allowed) and set(names) == allowed, (
              f"Only MOOSAHub and MOOSAArabic can be published, found {names}")
          repo = json.loads(Path("repo.json").read_text())
          expected = "https://raw.githubusercontent.com/MooOsa1/MOOSA-CloudStream/builds/plugins.json"
          assert repo["pluginLists"] == [expected], "Unexpected external plugin list"
          print("Verified exactly two internal plugins and no external plugin directory")
          PY
          rm -f "$GITHUB_WORKSPACE/builds"/*.cs3 "$GITHUB_WORKSPACE/builds"/plugins.json
          cp **/build/*.cs3 "$GITHUB_WORKSPACE/builds"/
          cp build/plugins.json "$GITHUB_WORKSPACE/builds"/plugins.json
          cp repo.json "$GITHUB_WORKSPACE/builds"/repo.json

      - name: Publish builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git pull --rebase origin builds
          git push
