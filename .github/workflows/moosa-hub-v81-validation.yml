name: Validate MOOSA Hub v81 subtitle language and availability (no release)
on:
  push:
    branches: ["fix/moosa-hub-v81-subtitle-language-identity"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Compile both CloudStream plugins
        run: gradle :MOOSAHub:make :MOOSAArabic:make makePluginsJson ensureJarCompatibility
      - name: Check precise subtitle language delivery and native header fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          versions={x["internalName"]:x["version"] for x in json.loads(Path("build/plugins.json").read_text())}
          assert versions.get("MOOSAHub",0)>=81 and versions.get("MOOSAArabic")==3,versions
          s=Path("MOOSAHub/src/main/kotlin/com/moosa/hub/MOOSAHubProvider.kt").read_text()
          assert 'byLanguage[PreferredSubtitleLanguage.ARABIC].orEmpty().take(10)' in s
          assert 'byLanguage[PreferredSubtitleLanguage.ENGLISH].orEmpty().take(5)' in s
          assert '(sub.headers ?: emptyMap()) + mapOf(' in s
          assert 'subtitle.copy(lang = "Arabic")' in s
          assert 'subtitle.copy(lang = "English")' in s
          assert 'PreferredSubtitleLanguage.OTHER -> null' in s
          assert 'if (playbackTrack != null && seenSubtitles.add(playbackTrack.url))' in s
          assert 'subtitleCallback(playbackTrack)' in s
          assert '"https://opensubtitles-v3.strem.io/subtitles/$type/$id.json"' in s
          assert 'filterReadableSubtitles(fetchExternalSubtitles(request))' in s
          print("PASS: v81 delivers only two canonical languages, verifies up to 36 candidates and preserves native subtitle headers")
          PY
      - name: Verify real subtitle index language labels and downloadable SRT content
        run: |
          python3 - <<'PY'
          import json, urllib.request, re
          cases=[("movie","tt0816692"),("series","tt0944947:1:1")]
          for media,id in cases:
              url=f"https://opensubtitles-v3.strem.io/subtitles/{media}/{id}.json"
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=12) as r:
                  records=json.load(r)["subtitles"]
              for requested_lang in ("ara","eng"):
                  links=[x["url"] for x in records if x.get("lang")==requested_lang and x.get("url","").startswith("https://")]
                  assert links, f"missing {media}/{requested_lang}"
                  successes=0
                  for track in links[:3]:
                      try:
                          with urllib.request.urlopen(urllib.request.Request(track,headers={"User-Agent":"Mozilla/5.0","Range":"bytes=0-32767"}),timeout=12) as r:
                              b=r.read(32768)
                          s=b.decode("utf-8",errors="replace")
                          if not re.search(r"(?:\d{1,2}:)?\d{2}:\d{2}[,.]\d{1,3}\s*-->\s*(?:\d{1,2}:)?\d{2}:\d{2}[,.]\d{1,3}",s):
                              continue
                          if requested_lang=="ara" and sum('\u0600'<=c<='\u06ff' for c in s)<8:continue
                          if requested_lang=="eng" and sum('a'<=c.lower()<='z' for c in s)<12:continue
                          successes+=1
                      except Exception as e:print("SKIP_LINK",media,requested_lang,type(e).__name__)
                  print("REAL_FILES",media,requested_lang,"candidate_count",len(links),"verified",successes,flush=True)
                  assert successes>=1, f"no working {media}/{requested_lang} subtitle tracks"
          print("PASS: external subtitles still work for Arabic and English movie and series samples")
          PY
