name: Original Vidlink live CC-film provider feasibility
on:
  push:
    branches: [experiment/js-plugin-sidecar-v1]
    paths:
      - 'MOOSAWeb/tests/streamline-live-open-movie.cjs'
      - '.github/workflows/streamline-live-open-movie.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: moosa
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: itsmeadarsh2008/Streamline
          ref: 5160850f93b519755dc0878abd3c43482e3e1449
          path: third-party/streamline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read original Vidlink endpoint responses for licensed CC film; do not fetch video URLs
        run: node moosa/MOOSAWeb/tests/streamline-live-open-movie.cjs
