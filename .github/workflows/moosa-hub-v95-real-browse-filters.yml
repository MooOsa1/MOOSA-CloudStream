name: Validate MOOSA Hub v95 server-side Show More filters (no release)
on:
  push:
    branches: ["feat/moosa-hub-v95-show-more-real-filters"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Compile MOOSA Hub and Arabic
        run: gradle :MOOSAHub:make :MOOSAArabic:make makePluginsJson ensureJarCompatibility
      - name: Smoke-test actual TMDB genre and country response data
        run: |
          python3 - <<'PY'
          import re, json, urllib.parse, urllib.request
          from pathlib import Path
          source=Path('MOOSAHub/src/main/kotlin/com/moosa/hub/MOOSACatalog.kt').read_text()
          match=re.search(r'private const val TMDB_KEY = "([^"]+)"',source)
          assert match, "TMDB key missing from installed provider"
          key=match.group(1)
          samples=[
              ('movie', {'sort_by':'popularity.desc','with_genres':'28'}, 28),
              ('tv', {'sort_by':'popularity.desc','with_genres':'80'}, 80),
              ('movie', {'sort_by':'vote_average.desc','with_origin_country':'IN','vote_count.gte':'100'}, None)
          ]
          for media,params,genre in samples:
              params.update(api_key=key,page='1',language='en-US',include_adult='false')
              url='https://api.themoviedb.org/3/discover/'+media+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'MOOSAHub-Subtitle-CI'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  result=json.loads(response.read())
              titles=result.get('results',[])
              assert titles,'No actual TMDB titles for '+media
              if genre is not None:
                  assert all(genre in x.get('genre_ids',[]) for x in titles),'TMDB genre mismatch'
              if 'with_origin_country' in params:
                  assert all(x.get('id') for x in titles),'Origin-filtered items lack TMDB IDs'
              print('PASS: live TMDB',media,'genre',genre or 'all','returned',len(titles),'real IDs')
          PY
      - name: Verify real discover requests, pagination, reset and TV focus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('MOOSAHub/src/main/kotlin/com/moosa/hub')
          f=(root/'MOOSABrowseFilters.kt').read_text()
          d=(root/'MOOSABrowseDialog.kt').read_text()
          c=(root/'MOOSACatalog.kt').read_text()
          manifest={item['internalName']:item['version'] for item in json.loads(Path('build/plugins.json').read_text())}
          assert manifest=={'MOOSAHub':95,'MOOSAArabic':3},manifest
          # Filter choices use real TMDB server-side discover endpoints.
          for token in [
              'data class Selection(', 'fun availableGenres(isTv: Boolean)',
              'fun withType(selection: Selection, isTv: Boolean)',
              'fun toRequest(original: MainPageRequest, choice: Selection)',
              'data = "/discover/$type?$query"',
              'params["with_genres"] = it.toString()',
              'params["with_origin_country"] = choice.originCountry',
              'params["vote_count.gte"] = if (choice.isTv) "50" else "100"',
              '"first_air_date.desc"', '"primary_release_date.desc"',
              'params["include_null_first_air_dates"] = "false"',
              'TimeZone.getTimeZone("UTC")',
          ]: assert token in f,token
          # Confirm genuinely correct movie and TV IDs, not fake local filtering.
          for entry in [
              'GenreChoice("action", "Action", movieId = 28)',
              'GenreChoice("action_adventure", "Action & Adventure", tvId = 10759)',
              'GenreChoice("horror", "Horror", movieId = 27)',
              'GenreChoice("scifi_fantasy", "Sci-Fi & Fantasy", tvId = 10765)',
              'GenreChoice("crime", "Crime", 80, 80)',
          ]: assert entry in f,entry
          assert 'genres.filter { it.id(isTv) != null }' in f
          for token in [
              'private fun selectedRequest(): MainPageRequest',
              'MOOSABrowseFilters.toRequest(request, it)',
              'typeButton.setOnClickListener',
              'genreButton.setOnClickListener',
              'sortButton.setOnClickListener',
              'countryButton.setOnClickListener',
              'resetButton.setOnClickListener { applyFilters(null) }',
              'browseJob?.cancel()', 'browseGeneration += 1',
              'adapter.submitList(emptyList())', 'recycler.scrollToPosition(0)',
              'id = View.generateViewId()',
              'val effectiveRequest = selectedRequest()',
              'if (generation != browseGeneration) return',
              'request = effectiveRequest',
          ]: assert token in d,token
          assert d.count('request = effectiveRequest') == 2
          assert 'MOOSACatalog.browseBatch(' in d
          assert 'val path = request.data.substringBefore("?")' in c
          assert 'val options = queryOptions(path, extras)' in c
          assert 'listPage(api, path, safeStart, isTv, options)' in c
          assert 'val isTv = path.contains("/tv/") || path == "/discover/tv"' in c
          assert 'MOOSASeeAll.register(' in c
          assert '.filter { it.originalLanguage != "ar" }' not in d
          print('PASS: v95 compiled; real TMDB type/genre/sort/country filters, cancellable pagination and stable home UI')
          PY
