name: Original CineStream DEX -> JVM linkage proof
on:
  push:
    branches: [experiment/cloudstream-jvm-engine-20261016]
    paths:
      - 'MOOSAJVM/**'
      - '.github/workflows/cloudstream-jvm-linkage-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile real CloudStream JVM library (not Android)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/recloudstream/cloudstream.git /tmp/cloudstream-upstream
          cd /tmp/cloudstream-upstream
          chmod +x ./gradlew
          cat >> library/build.gradle.kts <<'GRADLE'
          
          tasks.register("moosaJvmClasspath") {
              doLast {
                  val path = configurations.getByName("jvmRuntimeClasspath")
                      .files.joinToString(":") { it.absolutePath }
                  file("build/moosa-jvm-runtime-classpath.txt").writeText(path)
                  println("MOOSA_JVM_RUNTIME_CLASSPATH_READY")
              }
          }
          GRADLE
          ./gradlew :library:jvmJar :library:moosaJvmClasspath --no-daemon --no-configuration-cache --console plain
          test -s library/build/libs/library-jvm-1.0.1.jar
          test -s library/build/moosa-jvm-runtime-classpath.txt
      - name: Download SHA256-verified original CineStream cs3, convert to Java class files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/converted
          curl -fLsS --retry 2 https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip -o /tmp/dex-tools.zip
          unzip -q /tmp/dex-tools.zip -d /tmp/dex-tools
          converter="$(find /tmp/dex-tools -name d2j-dex2jar.sh -print -quit)"
          chmod +x "$converter"
          echo 'DEX2JAR_MEMORY_SETTINGS:'
          grep -nE 'Xmx|JAVA_OPTS|java ' "$converter" | head -n 12 || true
          root=https://raw.githubusercontent.com/SaurabhKaperwan/CSX/builds
          curl -fLsS --retry 2 "$root/plugins.json" -o /tmp/index.json
          digest="$(jq -r --arg n CineStream --arg u "$root/CineStream.cs3" '[.[]|select(.internalName==$n and .url==$u)]|sort_by(.version)|last|.fileHash // empty' /tmp/index.json)"
          [[ "$digest" =~ ^sha256-[a-f0-9]{64}$ ]]
          curl -fLsS --retry 2 "$root/CineStream.cs3" -o /tmp/CineStream.cs3
          echo "$(echo "$digest"|sed s/^sha256-//)  /tmp/CineStream.cs3"|sha256sum --check
          unzip -p /tmp/CineStream.cs3 classes.dex >/tmp/CineStream.dex
          "$converter" --force --output /tmp/converted/CineStream.jar /tmp/CineStream.dex
          test -s /tmp/converted/CineStream.jar
          echo "CINESTREAM_JVM_BYTECODE_CLASSES=$(jar tf /tmp/converted/CineStream.jar|grep -c '\.class$')"
          javap -classpath /tmp/converted/CineStream.jar -public com.megix.CineStream | head -n 24
          javap -classpath /tmp/converted/CineStream.jar -public com.megix.CineStreamProvider | head -n 27
      - name: Observe real linking blockers on unmodified original CineStream provider
        shell: bash
        run: |
          javac MOOSAJVM/ClassProbe.java
          runtime="$(cat /tmp/cloudstream-upstream/library/build/moosa-jvm-runtime-classpath.txt)"
          java -cp "MOOSAJVM:$runtime" ClassProbe /tmp/cloudstream-upstream/library/build/libs/library-jvm-1.0.1.jar /tmp/converted/CineStream.jar com.megix.CineStreamProvider com.megix.CineStream
          javac MOOSAJVM/ProviderInstanceProbe.java
          timeout 25 java -Xmx512m -cp "MOOSAJVM:$runtime" ProviderInstanceProbe /tmp/cloudstream-upstream/library/build/libs/library-jvm-1.0.1.jar /tmp/converted/CineStream.jar
      - name: Run actual CineStream original provider search on JVM (licensed catalog metadata only)
        shell: bash
        run: |
          runtime="$(cat /tmp/cloudstream-upstream/library/build/moosa-jvm-runtime-classpath.txt)"
          javac -cp "$runtime" MOOSAJVM/ProviderSearchProbe.java
          timeout 44 java -Xmx768m -cp "MOOSAJVM:$runtime" ProviderSearchProbe /tmp/cloudstream-upstream/library/build/libs/library-jvm-1.0.1.jar /tmp/converted/CineStream.jar
      - name: Invoke original CineStreamProvider.load for licensed Sintel catalog metadata
        shell: bash
        run: |
          runtime="$(cat /tmp/cloudstream-upstream/library/build/moosa-jvm-runtime-classpath.txt)"
          javac -cp "$runtime" MOOSAJVM/ProviderLoadProbe.java
          timeout 34 java -Xmx768m -cp "MOOSAJVM:$runtime" ProviderLoadProbe /tmp/cloudstream-upstream/library/build/libs/library-jvm-1.0.1.jar /tmp/converted/CineStream.jar
      - name: Inventory missing Android and application classes across CineStream bytecode
        shell: bash
        run: |
          runtime="$(cat /tmp/cloudstream-upstream/library/build/moosa-jvm-runtime-classpath.txt)"
          official=/tmp/cloudstream-upstream/library/build/libs/library-jvm-1.0.1.jar
          timeout 90 jdeps --missing-deps --multi-release 21 -q -cp "$runtime:$official:MOOSAJVM" /tmp/converted/CineStream.jar > /tmp/cinestream-jdeps.txt 2>&1
          if grep -q '^Error:' /tmp/cinestream-jdeps.txt; then
            cat /tmp/cinestream-jdeps.txt
            exit 1
          fi
          echo "JDEPS_DIAGNOSTIC_LINES=$(wc -l < /tmp/cinestream-jdeps.txt)"
          sed -n '1,15p' /tmp/cinestream-jdeps.txt
          python3 - <<'PY'
          import re,collections
          missing=set()
          for row in open('/tmp/cinestream-jdeps.txt',errors='replace'):
            m=re.search(r'\s+->\s+(\S+)\s+not found\s*$',row)
            if m: missing.add(m.group(1))
          counts=collections.Counter(
            'android' if x.startswith('android.') else
            'androidx' if x.startswith('androidx.') else
            'cloudstream_application' if x.startswith('com.lagradost.cloudstream3.') else
            'other' for x in missing
          )
          print('CINESTREAM_JVM_UNRESOLVED total='+str(len(missing))+' groups='+repr(dict(counts)))
          print('CINESTREAM_JVM_UNRESOLVED_SAMPLES '+', '.join(sorted(missing)[:45]))
          core=collections.defaultdict(set)
          with open('/tmp/cinestream-jdeps.txt',errors='replace') as source:
            for row in source:
              if '->' not in row or 'not found' not in row: continue
              left,right=row.split('->',1)
              owner=left.strip().split()[-1]
              dep=right.strip().split()[0]
              if owner.startswith('com.megix.'): core[owner].add(dep)
          for cls,deps in sorted(core.items(),key=lambda x:-len(x[1]))[:17]:
            print('CINESTREAM_MISSING_OWNER '+cls+' count='+str(len(deps))+' dependencies='+','.join(sorted(deps)[:13]))
          PY
      - name: Invoke original CineStreamProvider.loadLinks against licensed Sintel with no video downloads
        shell: bash
        run: |
          runtime="$(cat /tmp/cloudstream-upstream/library/build/moosa-jvm-runtime-classpath.txt)"
          javac -cp "$runtime" -d MOOSAJVM MOOSAJVM/shims/com/lagradost/cloudstream3/network/CloudflareKiller.java
          javac -d MOOSAJVM MOOSAJVM/shims/android/content/SharedPreferences.java
          javac -d MOOSAJVM MOOSAJVM/shims/com/megix/settings/Settings.java
          javac -cp MOOSAJVM -d MOOSAJVM MOOSAJVM/shims/android/content/Context.java
          javac -cp "MOOSAJVM:$runtime" -d MOOSAJVM MOOSAJVM/shims/com/lagradost/cloudstream3/CloudStreamApp.java MOOSAJVM/shims/com/lagradost/cloudstream3/utils/DataStore.java
          javac -cp "MOOSAJVM:$runtime" MOOSAJVM/HlsSourceProbe.java MOOSAJVM/ProviderLinksProbe.java
          timeout 85 java -Xmx768m -cp "MOOSAJVM:$runtime" ProviderLinksProbe /tmp/cloudstream-upstream/library/build/libs/library-jvm-1.0.1.jar /tmp/converted/CineStream.jar
