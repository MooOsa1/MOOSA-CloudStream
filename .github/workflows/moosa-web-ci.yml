name: MOOSA Web — Node checks
on:
  push:
    paths:
      - 'MOOSAWeb/**'
      - 'render.yaml'
      - '.github/workflows/moosa-web-ci.yml'
  pull_request:
    paths:
      - 'MOOSAWeb/**'
      - 'render.yaml'
      - '.github/workflows/moosa-web-ci.yml'
  workflow_dispatch:
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd MOOSAWeb && npm run check
