name: Reya VidNest exact-stream PTS and subtitle duration audit
on:
  push:
    branches: [audit/moosa-live-4k-20261024]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare each Reya provider timeline to exact episode native captions
        shell: python
        run: |
          import json,urllib.request,urllib.parse,urllib.error,subprocess,re,tempfile,statistics
          H={"User-Agent":"Mozilla/5.0 (Linux; Android 7.1.2) AppleWebKit/537.36 Chrome/123 Safari/537.36"}
          def get(url,cap=2500000):
              req=urllib.request.Request(url,headers=H)
              with urllib.request.urlopen(req,timeout=15) as r:
                  return r.read(cap)
          def probe(data):
              with tempfile.NamedTemporaryFile(suffix=".mp4") as f:
                  f.write(data);f.flush()
                  p=subprocess.run(["ffprobe","-v","error","-show_entries","stream=index,codec_type,codec_name,start_time,duration:format=start_time,duration","-of","json",f.name],capture_output=True,text=True,timeout=20)
                  return json.loads(p.stdout) if p.returncode==0 else {"error":p.stderr[:90]}
          def ts(t):
              parts=[float(x) for x in t.replace(',','.').split(':')]
              return sum(p * [3600,60,1][-len(parts)+i] for i,p in enumerate(parts))
          for ep in [3,5]:
              obj=json.loads(get(f"https://vidnst.reyamika.eu.cc/api/stream?tmdbId=60059&type=tv&season=2&episode={ep}",220000))
              print("EP",ep,"SOURCE COUNT",len(obj.get("streams",[])),flush=True)
              sub={}
              for item in obj.get("subtitles",[]):
                  if item.get("label") not in ("Arabic","English"):continue
                  raw=get(item["url"],85000).decode("utf8","replace")
                  cue=re.findall(r'(?m)^\s*(\d\d:\d\d:\d\d\.\d{3}|\d\d:\d\d\.\d{3})\s*-->\s*(\d\d:\d\d:\d\d\.\d{3}|\d\d:\d\d\.\d{3})',raw)
                  sub[item["label"]]= (len(cue), ts(cue[0][0]) if cue else None,ts(cue[-1][1]) if cue else None)
              print("CAPTIONS DURATION STATS",sub,flush=True)
              for it in obj.get("streams",[])[:5]:
                  name=it.get("source","") or it.get("name","")
                  host=urllib.parse.urlparse(it.get("url","")).hostname
                  print("SOURCE",name,"HOST",host,flush=True)
                  try:
                      master=get(it["url"],100000).decode()
                      ls=master.splitlines()
                      var=[]
                      for i,line in enumerate(ls[:-1]):
                          if line.startswith("#EXT-X-STREAM-INF:") and "RESOLUTION=" in line:
                              m=re.search(r'RESOLUTION=(\d+)x(\d+)',line)
                              if m and i+1<len(ls):
                                  var.append((int(m.group(2)),urllib.parse.urljoin(it["url"],ls[i+1].strip())))
                      print("VARIANTS",name,[x[0] for x in var],flush=True)
                      for height,url in sorted(var,key=lambda x:-x[0]):
                          if height not in (2160,1080,720):continue
                          try:
                              pl=get(url,190000).decode()
                              init=re.search(r'#EXT-X-MAP:[^\r\n]*URI="([^"]+)"',pl)
                              segments=[line.strip() for line in pl.splitlines() if line.strip() and not line.strip().startswith("#")]
                              dur=[float(m.group(1)) for m in re.finditer(r'#EXTINF:([0-9.]+)',pl)]
                              print("MEDIA",name,height,"init",bool(init),"segments",len(segments),"length",round(sum(dur),2),
                                    "DISCONT",pl.count("#EXT-X-DISCONTINUITY"),"START",re.findall(r"#EXT-X-START:[^\r\n]+",pl)[:1],flush=True)
                              if not init or not segments:continue
                              initData=get(urllib.parse.urljoin(url,init.group(1)),80000)
                              for ix in [0,1,12]:
                                  if ix>=len(segments):continue
                                  segment=get(urllib.parse.urljoin(url,segments[ix]),12000000)
                                  data=initData+segment
                                  result=probe(data)
                                  print("PTS",name,height,ix,"segmentbytes",len(segment),"probe",result,flush=True)
                              if height==2160:break
                          except Exception as e:print("ERROR MEDIA",name,height,type(e).__name__,str(e)[:100],flush=True)
                  except Exception as e:print("ERROR SOURCE",name,type(e).__name__,str(e)[:100],flush=True)
