name: Reya repeat duration consistency audit
on:
  push:
    branches: [audit/moosa-live-4k-20261024]
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare HLS catalog durations and per-episode VTT duration repeatedly
        shell: python
        run: |
          import urllib.request,urllib.parse,json,re,time,hashlib
          H={"User-Agent":"Mozilla/5.0 (Linux; Android 7.1.2) AppleWebKit/537.36 Chrome/123 Safari/537.36"}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=11) as r:
                  return r.read(190000)
          for ep in [3,5]:
              for k in range(2):
                  try:
                      obj=json.loads(get(f"https://vidnst.reyamika.eu.cc/api/stream?tmdbId=60059&type=tv&season=2&episode={ep}"))
                      native=[x for x in obj.get("subtitles",[]) if x.get("label")=="English"]
                      last=None
                      if native:
                          body=get(native[0]["url"]).decode("utf8","replace")
                          cues=re.findall(r'(?m)^\s*([\d:.]+)\s*-->\s*([\d:.]+)',body)
                          if cues:
                              nums=[float(t) for t in cues[-1][1].split(":")]
                              last=nums[0]*3600+nums[1]*60+nums[2] if len(nums)==3 else nums[0]*60+nums[1]
                      print("EPISODE",ep,"ITERATION",k,"metadata",obj.get("season"),obj.get("episode"),"subtitle_end_seconds",last,flush=True)
                      for s in obj.get("streams",[])[:2]:
                          server=s.get("server")
                          master=get(s["url"]).decode("utf8","replace")
                          variants=[]
                          lines=master.splitlines()
                          for i,l in enumerate(lines[:-1]):
                              if not l.startswith("#EXT-X-STREAM-INF:"):continue
                              m=re.search(r'RESOLUTION=\d+x(\d+)',l)
                              if m:variants.append((int(m.group(1)),urllib.parse.urljoin(s["url"],lines[i+1].strip())))
                          for height,u in sorted(variants,key=lambda x:-x[0])[:1]:
                              data=get(u).decode("utf8","replace")
                              dur=sum(float(x) for x in re.findall(r'(?m)^#EXTINF:([0-9.]+)',data))
                              count=data.count("#EXTINF:")
                              print("VARIANT",ep,k,server,height,"seconds",round(dur,2),"segments",count,
                                    "urlHash",hashlib.sha256(u.encode()).hexdigest()[:12],
                                    "delta_vtt_end",round(dur-last,2) if last else None,flush=True)
                  except Exception as e:print("ERROR",ep,k,type(e).__name__,str(e)[:100],flush=True)
                  time.sleep(2)
