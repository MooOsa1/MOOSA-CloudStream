name: MOOSA independent source reality-check (no release)
on:
  push:
    branches:
      - audit/moosa-live-4k-20261024
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Vidlink and Reya public HTTP API for BCS and movie
        shell: python
        run: |
          import urllib.request,urllib.error,urllib.parse,json,re,concurrent.futures
          hdr={"User-Agent":"Mozilla/5.0 (Linux; Android 7.1.2) AppleWebKit/537.36 Chrome/123 Safari/537.36",
               "Accept":"application/json, */*"}
          def get(url,timeout=13):
              try:
                  req=urllib.request.Request(url,headers=hdr)
                  with urllib.request.urlopen(req,timeout=timeout) as resp:
                      return resp.status,resp.headers.get("Content-Type",""),resp.read(140000)
              except urllib.error.HTTPError as e:
                  return e.code,e.headers.get("Content-Type",""),e.read(1000)
              except Exception as e:
                  return 0,type(e).__name__,str(e).encode()[:90]
          def describe(label,url):
              st,ct,data=get(url)
              try: obj=json.loads(data)
              except: obj={}
              summary={"status":st,"type":ct[:45],"responseKeys":list(obj.keys())[:16] if isinstance(obj,dict) else "non-dict"}
              if isinstance(obj,dict):
                  sources=obj.get("streams",obj.get("sources",obj.get("links",[])))
                  if isinstance(sources,list):
                      summary["count"]=len(sources)
                      q={}
                      domains={}
                      for row in sources[:60]:
                          if not isinstance(row,dict):continue
                          title=" ".join(str(row.get(k,"")) for k in ("name","title","quality","description"))
                          match=re.findall(r"2160p|4k|1080p|720p|480p",title,re.I)
                          for x in match:q[x.lower()]=q.get(x.lower(),0)+1
                          link=row.get("url","")
                          if isinstance(link,str):
                              host=urllib.parse.urlparse(link).hostname
                              if host:domains[host]=domains.get(host,0)+1
                      summary["qualityLabels"]=q
                      summary["sourceHostCounts"]=domains
                  summary["error"]=str(obj.get("error",""))[:70]
              print(label,summary,flush=True)
          endpoints=[
              ("Reya health","https://vidnst.reyamika.eu.cc/health"),
              ("Reya BCS","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=60059&type=tv&season=2&episode=3"),
              ("Reya movie","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=238&type=movie"),
              ("Reya movie alt","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=238&mediaType=movie"),
              ("Vidlink old movie","https://vidlink.pro/api/movie/238"),
              ("Vidlink old tv","https://vidlink.pro/api/tv/60059/2/3"),
              ("Castle movie","https://castle.fm/api/movie/238"),
              ("Castle tv","https://castle.fm/api/tv/60059/2/3"),
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for _ in pool.map(lambda x:describe(*x),endpoints):pass
          st,ct,data=get("https://enc-dec.app/api/enc-vidlink?text=238")
          try: encoded=json.loads(data).get("result","")
          except: encoded=""
          print("Vidlink encrypt status",st,"nonblank",bool(encoded),flush=True)
          if encoded and len(encoded)<500:
              describe("Vidlink new movie multiLang", "https://vidlink.pro/api/b/movie/"+urllib.parse.quote(encoded,safe="")+"?multiLang=1")
          st,ct,data=get("https://enc-dec.app/api/enc-vidlink?text=60059")
          try: encoded=json.loads(data).get("result","")
          except: encoded=""
          print("Vidlink encrypt TV status",st,"nonblank",bool(encoded),flush=True)
          if encoded and len(encoded)<500:
              describe("Vidlink new BCS multiLang","https://vidlink.pro/api/b/tv/"+urllib.parse.quote(encoded,safe="")+"/2/3?multiLang=1")

      - name: Inspect Reya source quality claims and HTTP media bytes
        shell: python
        run: |
          import concurrent.futures,urllib.request,urllib.error,urllib.parse,re,json,subprocess
          targets=[
             ("BCS","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=60059&type=tv&season=2&episode=3"),
             ("Godfather","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=238&type=movie"),
          ]
          HEAD={"User-Agent":"Mozilla/5.0 (Linux; Android 7.1.2) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36","Accept":"application/json"}
          def get(url,headers=None,limit=18000):
              req=urllib.request.Request(url,headers=HEAD | (headers or {}))
              try:
                  with urllib.request.urlopen(req,timeout=9) as resp:
                      return resp.status,resp.headers.get("Content-Type",""),resp.headers.get("Content-Range",""),resp.read(limit),resp.geturl()
              except urllib.error.HTTPError as e:
                  return e.code,e.headers.get("Content-Type",""),e.headers.get("Content-Range",""),e.read(800),url
              except Exception as e:
                  return 0,type(e).__name__,"",str(e).encode()[:100],url
          def inspect(label,src):
              if not isinstance(src,dict):return
              url=src.get("url") or src.get("streamUrl")
              if not isinstance(url,str) or not url.startswith("https://"):return
              host=urllib.parse.urlparse(url).hostname
              headers=src.get("headers") if isinstance(src.get("headers"),dict) else {}
              status,ctype,rangev,body,final=get(url,headers|{"Range":"bytes=0-16383"})
              textdata=body.decode("utf8","ignore")
              extm3u=textdata.lstrip().startswith("#EXTM3U")
              heights=list(sorted(set(map(int,re.findall(r'RESOLUTION=\d+x(\d+)',textdata,re.I))),reverse=True))
              audioTracks=len(re.findall(r'#EXT-X-MEDIA:TYPE=AUDIO',textdata,re.I))
              childSegments=len(re.findall(r'#EXTINF:',textdata))
              print(label,"host",host,"status",status,"mime",ctype[:55],
                    "rangeHeader",bool(rangev),"m3u8",extm3u,
                    "heights",heights[:8],"audioTracks",audioTracks,
                    "mediaSegments",childSegments,
                    "mediaStart",body[:6].hex() if not extm3u else "HLS",
                    "redirectHost",urllib.parse.urlparse(final).hostname,flush=True)
          for name,endpoint in targets:
              st,ct,_,body,_=get(endpoint,limit=250000)
              try: data=json.loads(body)
              except: data={}
              items=data.get("streams",[]) if isinstance(data,dict) else []
              print(name,"SOURCE_COUNT",len(items),flush=True)
              for i,x in enumerate(items[:15]):
                  print(name,"SOURCE",i,"fields",sorted(x.keys()) if isinstance(x,dict) else [],
                        "name",str(x.get("name",""))[:65] if isinstance(x,dict) else "",
                        "type",str(x.get("type",""))[:35] if isinstance(x,dict) else "",
                        "quality",str(x.get("quality",""))[:40] if isinstance(x,dict) else "",
                        "lang",str(x.get("language",""))[:45] if isinstance(x,dict) else "",
                        "headers",list(x.get("headers",{}).keys()) if isinstance(x,dict) and isinstance(x.get("headers"),dict) else [],
                        flush=True)
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
                  futures=[pool.submit(inspect,name+" "+str(i),x) for i,x in enumerate(items[:10])]
                  for f in futures:
                      try:f.result()
                      except Exception as e:print("PROBE_ERROR",type(e).__name__,str(e)[:70],flush=True)
