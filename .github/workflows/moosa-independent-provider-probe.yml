name: MOOSA independent source reality-check (no release)
on:
  push:
    branches:
      - audit/moosa-live-4k-20261024
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Vidlink and Reya public HTTP API for BCS and movie
        shell: python
        run: |
          import urllib.request,urllib.error,urllib.parse,json,re,concurrent.futures
          hdr={"User-Agent":"Mozilla/5.0 (Linux; Android 7.1.2) AppleWebKit/537.36 Chrome/123 Safari/537.36",
               "Accept":"application/json, */*"}
          def get(url,timeout=13):
              try:
                  req=urllib.request.Request(url,headers=hdr)
                  with urllib.request.urlopen(req,timeout=timeout) as resp:
                      return resp.status,resp.headers.get("Content-Type",""),resp.read(140000)
              except urllib.error.HTTPError as e:
                  return e.code,e.headers.get("Content-Type",""),e.read(1000)
              except Exception as e:
                  return 0,type(e).__name__,str(e).encode()[:90]
          def describe(label,url):
              st,ct,data=get(url)
              try: obj=json.loads(data)
              except: obj={}
              summary={"status":st,"type":ct[:45],"responseKeys":list(obj.keys())[:16] if isinstance(obj,dict) else "non-dict"}
              if isinstance(obj,dict):
                  sources=obj.get("streams",obj.get("sources",obj.get("links",[])))
                  if isinstance(sources,list):
                      summary["count"]=len(sources)
                      q={}
                      domains={}
                      for row in sources[:60]:
                          if not isinstance(row,dict):continue
                          title=" ".join(str(row.get(k,"")) for k in ("name","title","quality","description"))
                          match=re.findall(r"2160p|4k|1080p|720p|480p",title,re.I)
                          for x in match:q[x.lower()]=q.get(x.lower(),0)+1
                          link=row.get("url","")
                          if isinstance(link,str):
                              host=urllib.parse.urlparse(link).hostname
                              if host:domains[host]=domains.get(host,0)+1
                      summary["qualityLabels"]=q
                      summary["sourceHostCounts"]=domains
                  summary["error"]=str(obj.get("error",""))[:70]
              print(label,summary,flush=True)
          endpoints=[
              ("Reya health","https://vidnst.reyamika.eu.cc/health"),
              ("Reya BCS","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=60059&type=tv&season=2&episode=3"),
              ("Reya movie","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=238&type=movie"),
              ("Reya movie alt","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=238&mediaType=movie"),
              ("Vidlink old movie","https://vidlink.pro/api/movie/238"),
              ("Vidlink old tv","https://vidlink.pro/api/tv/60059/2/3"),
              ("Castle movie","https://castle.fm/api/movie/238"),
              ("Castle tv","https://castle.fm/api/tv/60059/2/3"),
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for _ in pool.map(lambda x:describe(*x),endpoints):pass
          st,ct,data=get("https://enc-dec.app/api/enc-vidlink?text=238")
          try: encoded=json.loads(data).get("result","")
          except: encoded=""
          print("Vidlink encrypt status",st,"nonblank",bool(encoded),flush=True)
          if encoded and len(encoded)<500:
              describe("Vidlink new movie multiLang", "https://vidlink.pro/api/b/movie/"+urllib.parse.quote(encoded,safe="")+"?multiLang=1")
          st,ct,data=get("https://enc-dec.app/api/enc-vidlink?text=60059")
          try: encoded=json.loads(data).get("result","")
          except: encoded=""
          print("Vidlink encrypt TV status",st,"nonblank",bool(encoded),flush=True)
          if encoded and len(encoded)<500:
              describe("Vidlink new BCS multiLang","https://vidlink.pro/api/b/tv/"+urllib.parse.quote(encoded,safe="")+"/2/3?multiLang=1")

      - name: Inspect Reya source quality claims and HTTP media bytes
        shell: python
        run: |
          import concurrent.futures,urllib.request,urllib.error,urllib.parse,re,json,subprocess
          targets=[
             ("BCS","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=60059&type=tv&season=2&episode=3"),
             ("Godfather","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=238&type=movie"),
          ]
          HEAD={"User-Agent":"Mozilla/5.0 (Linux; Android 7.1.2) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36","Accept":"application/json"}
          def get(url,headers=None,limit=18000):
              req=urllib.request.Request(url,headers=HEAD | (headers or {}))
              try:
                  with urllib.request.urlopen(req,timeout=9) as resp:
                      return resp.status,resp.headers.get("Content-Type",""),resp.headers.get("Content-Range",""),resp.read(limit),resp.geturl()
              except urllib.error.HTTPError as e:
                  return e.code,e.headers.get("Content-Type",""),e.headers.get("Content-Range",""),e.read(800),url
              except Exception as e:
                  return 0,type(e).__name__,"",str(e).encode()[:100],url
          def inspect(label,src):
              if not isinstance(src,dict):return
              url=src.get("url") or src.get("streamUrl")
              if not isinstance(url,str) or not url.startswith("https://"):return
              host=urllib.parse.urlparse(url).hostname
              headers=src.get("headers") if isinstance(src.get("headers"),dict) else {}
              status,ctype,rangev,body,final=get(url,headers|{"Range":"bytes=0-16383"})
              textdata=body.decode("utf8","ignore")
              extm3u=textdata.lstrip().startswith("#EXTM3U")
              heights=list(sorted(set(map(int,re.findall(r'RESOLUTION=\d+x(\d+)',textdata,re.I))),reverse=True))
              audioTracks=len(re.findall(r'#EXT-X-MEDIA:TYPE=AUDIO',textdata,re.I))
              childSegments=len(re.findall(r'#EXTINF:',textdata))
              print(label,"host",host,"status",status,"mime",ctype[:55],
                    "rangeHeader",bool(rangev),"m3u8",extm3u,
                    "heights",heights[:8],"audioTracks",audioTracks,
                    "mediaSegments",childSegments,
                    "mediaStart",body[:6].hex() if not extm3u else "HLS",
                    "redirectHost",urllib.parse.urlparse(final).hostname,flush=True)
          for name,endpoint in targets:
              st,ct,_,body,_=get(endpoint,limit=250000)
              try: data=json.loads(body)
              except: data={}
              items=data.get("streams",[]) if isinstance(data,dict) else []
              print(name,"SOURCE_COUNT",len(items),flush=True)
              for i,x in enumerate(items[:15]):
                  print(name,"SOURCE",i,"fields",sorted(x.keys()) if isinstance(x,dict) else [],
                        "name",str(x.get("name",""))[:65] if isinstance(x,dict) else "",
                        "type",str(x.get("type",""))[:35] if isinstance(x,dict) else "",
                        "quality",str(x.get("quality",""))[:40] if isinstance(x,dict) else "",
                        "lang",str(x.get("language",""))[:45] if isinstance(x,dict) else "",
                        "headers",list(x.get("headers",{}).keys()) if isinstance(x,dict) and isinstance(x.get("headers"),dict) else [],
                        flush=True)
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
                  futures=[pool.submit(inspect,name+" "+str(i),x) for i,x in enumerate(items[:10])]
                  for f in futures:
                      try:f.result()
                      except Exception as e:print("PROBE_ERROR",type(e).__name__,str(e)[:70],flush=True)

      - name: Probe actual 2160p video bytes and audio from Reya HLS children
        shell: python
        run: |
          import urllib.request,urllib.parse,urllib.error,json,re,subprocess,tempfile,os
          HEAD={"User-Agent":"Mozilla/5.0 (Linux; Android 7.1.2) AppleWebKit/537.36 Chrome/123 Safari/537.36","Accept":"*/*"}
          def req(url,headers=None,maxb=300000):
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(url,headers=HEAD|(headers or {})),timeout=12
                  ) as response:
                      return response.status,response.headers.get("Content-Type",""),response.headers.get("Content-Range",""),response.read(maxb)
              except urllib.error.HTTPError as e:
                  return e.code,e.headers.get("Content-Type",""),"",e.read(1000)
              except Exception as e:
                  return 0,type(e).__name__,"",str(e).encode()[:200]
          for name,endpoint in [
              ("BCS-S02E03","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=60059&type=tv&season=2&episode=3"),
              ("TheGodfather","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=238&type=movie")
          ]:
              st,ct,_,body=req(endpoint,maxb=200000)
              sources=json.loads(body).get("streams",[]) if st==200 else []
              found=False
              for item in sources:
                  link=item.get("url","")
                  if not link.startswith("https://"):continue
                  st,ct,_,body=req(link,headers=item.get("headers") if isinstance(item.get("headers"),dict) else {},maxb=80000)
                  master=body.decode("utf8","ignore")
                  if st!=200 or not master.strip().startswith("#EXTM3U") or not re.search(r'RESOLUTION=3840x2160',master,re.I):continue
                  sourceName=str(item.get("source",""))[:70]
                  print(name,"2160 MASTER FOUND","source",sourceName,"status",st,flush=True)
                  lines=master.splitlines()
                  variants=[]
                  for i,line in enumerate(lines):
                      if not line.startswith("#EXT-X-STREAM-INF"):continue
                      height=re.search(r'RESOLUTION=\d+x(\d+)',line,re.I)
                      if not height or i+1>=len(lines):continue
                      if lines[i+1].strip().startswith("#"):continue
                      variants.append((int(height.group(1)),urllib.parse.urljoin(link,lines[i+1].strip())))
                  for height,vurl in sorted(variants,reverse=True)[:2]:
                      st2,ct2,_,vbody=req(vurl,maxb=100000)
                      media=vbody.decode("utf8","ignore")
                      isHls=media.strip().startswith("#EXTM3U")
                      if not isHls:
                          print(name,"VARIANT",height,"status",st2,"content-type",ct2[:50],"body-prefix",vbody[:7].hex(),flush=True)
                          continue
                      mediaLines=media.splitlines()
                      items=[line.strip() for line in mediaLines if line.strip() and not line.startswith("#")]
                      encrypted=any(line.startswith("#EXT-X-KEY:") and "METHOD=NONE" not in line for line in mediaLines)
                      mapline=next((line for line in mediaLines if line.startswith("#EXT-X-MAP:")),None)
                      print(name,"VARIANT",height,"status",st2,"playlistLen",len(vbody),"segments",len(items),"encrypted",encrypted,"map",bool(mapline),flush=True)
                      if encrypted or not items:continue
                      init=b""
                      if mapline:
                          u=re.search(r'URI="([^"]+)"',mapline)
                          if u:
                              _,_,_,init=req(urllib.parse.urljoin(vurl,u.group(1)),maxb=300000)
                      segment=urllib.parse.urljoin(vurl,items[0])
                      s3,c3,range3,part=req(segment,headers={"Range":"bytes=0-2097151"},maxb=2097152)
                      print(name,"SEGMENT",height,"status",s3,"mime",c3[:50],"bytes",len(part),"seekable",bool(range3),"firstbytes",part[:6].hex(),flush=True)
                      if s3 not in (200,206) or len(part)<2048 or part[:1] in (b'<',b'{'):continue
                      with tempfile.NamedTemporaryFile(suffix=".mp4" if mapline else ".ts",delete=False) as tmp:
                          tmp.write(init+part)
                          filename=tmp.name
                      try:
                          p=subprocess.run(["ffprobe","-v","error","-probesize","2000000","-analyzeduration","2000000","-show_entries",
                             "stream=codec_type,codec_name,width,height,channels:stream_tags=language","-of","json",filename],
                             capture_output=True,text=True,timeout=12)
                          parsed=json.loads(p.stdout) if p.stdout.strip().startswith("{") else {}
                          print(name,"FFPROBE",height,"exit",p.returncode,
                              "streams",[(x.get("codec_type"),x.get("codec_name"),x.get("width"),x.get("height"),x.get("tags",{}).get("language"))
                                  for x in parsed.get("streams",[])][:8],
                              "errorExcerpt",p.stderr[-140:],flush=True)
                      except Exception as e:
                          print(name,"FFPROBE_ERROR",height,type(e).__name__,str(e)[:75],flush=True)
                      finally:os.unlink(filename)
                  found=True
                  break
              print(name,"2160_MASTER_TESTED",found,flush=True)

      - name: Parse 4K MP4 init boxes and verify actual codec and dimensions
        shell: python
        run: |
          import urllib.request,urllib.parse,json,re,hashlib
          HEAD={"User-Agent":"Mozilla/5.0 (Linux; Android 7.1.2) AppleWebKit/537.36 Chrome/123 Safari/537.36"}
          def get(url,n=80000,headers=None):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=HEAD|(headers or {})),timeout=12) as r:
                      return r.status,r.headers.get("Content-Type",""),r.read(n)
              except Exception as e:return 0,type(e).__name__,str(e).encode()[:100]
          def boxes(data,start=0,end=None):
              end=len(data) if end is None else min(end,len(data))
              results=[]
              pos=start
              while pos+8<=end:
                  size=int.from_bytes(data[pos:pos+4],"big")
                  name=data[pos+4:pos+8].decode("latin1")
                  header=8
                  if size==1 and pos+16<=end:
                      size=int.from_bytes(data[pos+8:pos+16],"big");header=16
                  if size<8 or pos+size>end:break
                  results.append((name,pos+header,pos+size))
                  pos+=size
              return results
          def nested(buf,desc,*names):
              result=[("",0,len(buf))]
              for name in names:
                  result=[box for _,start,end in result for box in boxes(buf,start,end) if box[0]==name]
              return result
          def parseInit(data):
              tracks=[]
              for _,start,end in nested(data,None,"moov","trak"):
                  child=boxes(data,start,end)
                  tkhd=next((b for b in child if b[0]=="tkhd"),None)
                  mdia=next((b for b in child if b[0]=="mdia"),None)
                  if not mdia:continue
                  sub=boxes(data,mdia[1],mdia[2])
                  hdlr=next((b for b in sub if b[0]=="hdlr"),None)
                  mdhd=next((b for b in sub if b[0]=="mdhd"),None)
                  handler=""
                  if hdlr and hdlr[1]+12<=hdlr[2]:
                      handler=data[hdlr[1]+8:hdlr[1]+12].decode("latin1")
                  width=height=0
                  if tkhd and tkhd[2]-tkhd[1]>=8:
                      width=int.from_bytes(data[tkhd[2]-8:tkhd[2]-4],"big")>>16
                      height=int.from_bytes(data[tkhd[2]-4:tkhd[2]],"big")>>16
                  lang=None
                  if mdhd and mdhd[1]<mdhd[2]:
                      ver=data[mdhd[1]]
                      loc=mdhd[1]+(32 if ver==1 else 20)
                      if loc+2<=mdhd[2]:
                          v=int.from_bytes(data[loc:loc+2],"big")
                          lang="".join(chr(96+((v>>z)&31)) for z in (10,5,0))
                  tracks.append((handler,width,height,lang))
              return tracks
          for name,api in [
              ("BCS","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=60059&type=tv&season=2&episode=3"),
              ("Godfather","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=238&type=movie")
          ]:
              st,ct,b=get(api,200000)
              if st!=200:continue
              feeds=json.loads(b).get("streams",[])
              for item in feeds:
                  url=item.get("url","")
                  st,ct,b=get(url)
                  if st!=200 or b"#EXTM3U" not in b[:100]:continue
                  master=b.decode("utf8","ignore")
                  if "RESOLUTION=3840x2160" not in master:continue
                  lines=master.splitlines()
                  variants=[]
                  for idx,line in enumerate(lines):
                      if "#EXT-X-STREAM-INF" in line and "RESOLUTION=3840x2160" in line and idx+1<len(lines):
                          variants.append(urllib.parse.urljoin(url,lines[idx+1].strip()))
                  for variant in variants[:1]:
                      s2,_,data=get(variant,160000)
                      text=data.decode("utf8","ignore")
                      media=[l.strip() for l in text.splitlines() if l.strip() and not l.startswith("#")]
                      initMatch=re.search(r'#EXT-X-MAP:.*?URI="([^"]+)"',text)
                      if not initMatch or not media:
                          print(name,"NO_MAP_OR_MEDIA","segments",len(media),flush=True);continue
                      initurl=urllib.parse.urljoin(variant,initMatch.group(1))
                      segurl=urllib.parse.urljoin(variant,media[0])
                      stInit,typeInit,init=get(initurl,150000,{"Range":"bytes=0-149999"})
                      stSeg,typeSeg,seg=get(segurl,150000,{"Range":"bytes=0-149999"})
                      print(name,"MAP","status",stInit,"mime",typeInit[:40],"bytes",len(init),"head",init[:16].hex(),
                            "boxes",[(x[0],x[2]-x[1]) for x in boxes(init)[:8]],flush=True)
                      print(name,"SEG","status",stSeg,"mime",typeSeg[:40],"bytes",len(seg),"head",seg[:16].hex(),
                            "boxes",[(x[0],x[2]-x[1]) for x in boxes(seg)[:8]],
                            "sameDataPrefix",init[:100]==seg[:100],flush=True)
                      print(name,"ACTUAL_TRACKS",parseInit(init),flush=True)
                  break
