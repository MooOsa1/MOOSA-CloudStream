name: MOOSA independent source reality-check (no release)
on:
  push:
    branches:
      - audit/moosa-live-4k-20261024
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Vidlink and Reya public HTTP API for BCS and movie
        shell: python
        run: |
          import urllib.request,urllib.error,urllib.parse,json,re,concurrent.futures
          hdr={"User-Agent":"Mozilla/5.0 (Linux; Android 7.1.2) AppleWebKit/537.36 Chrome/123 Safari/537.36",
               "Accept":"application/json, */*"}
          def get(url,timeout=13):
              try:
                  req=urllib.request.Request(url,headers=hdr)
                  with urllib.request.urlopen(req,timeout=timeout) as resp:
                      return resp.status,resp.headers.get("Content-Type",""),resp.read(140000)
              except urllib.error.HTTPError as e:
                  return e.code,e.headers.get("Content-Type",""),e.read(1000)
              except Exception as e:
                  return 0,type(e).__name__,str(e).encode()[:90]
          def describe(label,url):
              st,ct,data=get(url)
              try: obj=json.loads(data)
              except: obj={}
              summary={"status":st,"type":ct[:45],"responseKeys":list(obj.keys())[:16] if isinstance(obj,dict) else "non-dict"}
              if isinstance(obj,dict):
                  sources=obj.get("streams",obj.get("sources",obj.get("links",[])))
                  if isinstance(sources,list):
                      summary["count"]=len(sources)
                      q={}
                      domains={}
                      for row in sources[:60]:
                          if not isinstance(row,dict):continue
                          title=" ".join(str(row.get(k,"")) for k in ("name","title","quality","description"))
                          match=re.findall(r"2160p|4k|1080p|720p|480p",title,re.I)
                          for x in match:q[x.lower()]=q.get(x.lower(),0)+1
                          link=row.get("url","")
                          if isinstance(link,str):
                              host=urllib.parse.urlparse(link).hostname
                              if host:domains[host]=domains.get(host,0)+1
                      summary["qualityLabels"]=q
                      summary["sourceHostCounts"]=domains
                  summary["error"]=str(obj.get("error",""))[:70]
              print(label,summary,flush=True)
          endpoints=[
              ("Reya health","https://vidnst.reyamika.eu.cc/health"),
              ("Reya BCS","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=60059&type=tv&season=2&episode=3"),
              ("Reya movie","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=238&type=movie"),
              ("Reya movie alt","https://vidnst.reyamika.eu.cc/api/stream?tmdbId=238&mediaType=movie"),
              ("Vidlink old movie","https://vidlink.pro/api/movie/238"),
              ("Vidlink old tv","https://vidlink.pro/api/tv/60059/2/3"),
              ("Castle movie","https://castle.fm/api/movie/238"),
              ("Castle tv","https://castle.fm/api/tv/60059/2/3"),
          ]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for _ in pool.map(lambda x:describe(*x),endpoints):pass
          st,ct,data=get("https://enc-dec.app/api/enc-vidlink?text=238")
          try: encoded=json.loads(data).get("result","")
          except: encoded=""
          print("Vidlink encrypt status",st,"nonblank",bool(encoded),flush=True)
          if encoded and len(encoded)<500:
              describe("Vidlink new movie multiLang", "https://vidlink.pro/api/b/movie/"+urllib.parse.quote(encoded,safe="")+"?multiLang=1")
          st,ct,data=get("https://enc-dec.app/api/enc-vidlink?text=60059")
          try: encoded=json.loads(data).get("result","")
          except: encoded=""
          print("Vidlink encrypt TV status",st,"nonblank",bool(encoded),flush=True)
          if encoded and len(encoded)<500:
              describe("Vidlink new BCS multiLang","https://vidlink.pro/api/b/tv/"+urllib.parse.quote(encoded,safe="")+"/2/3?multiLang=1")
