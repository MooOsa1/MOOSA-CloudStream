name: StreamPlay VidSrcSU upstream video server viability
on:
  push:
    branches: [diagnostics/cinestream-streamplay-direct-http-provider-20261016]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read upstream StreamPlay embed and test HLS master/segment on CC films
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          for(const [id,title] of [[45745,'Sintel'],[133701,'Tears of Steel'],[9761,'Elephants Dream']]){
            const result={title,tmdbId:id};
            try{
              const response=await fetch('https://vidsrc.su/embed/movie/'+id,
                {signal:AbortSignal.timeout(14000),redirect:'error'});
              const html=await response.text();
              result.embedStatus=response.status;
              result.embedBytes=html.length;
              result.hasFixedServers=html.includes('const fixedServers = ');
              result.hasMultiLang=html.includes('const MultiLang = ');
              const srcBlock=html.split('const fixedServers = ')[1]?.split(';')[0]||
                html.split('const MultiLang = ')[1]?.split(';')[0]||'';
              const urls=[...srcBlock.matchAll(/url:\s*'([^']+\.m3u8)'/g)]
                .map(x=>x[1]).slice(0,6);
              result.sourceCount=urls.length;
              result.sources=[];
              for(let i=0;i<urls.length;i++){
                const v={i};
                try{
                  const u=new URL(urls[i]);v.host=u.hostname;
                  const playlist=await fetch(urls[i],{
                    headers:{Origin:'https://moosa-web.onrender.com'},
                    signal:AbortSignal.timeout(10000),redirect:'error'
                  });
                  v.http=playlist.status;
                  v.cors=playlist.headers.get('access-control-allow-origin');
                  if(playlist.ok){
                    const body=await playlist.text();
                    v.hls=body.startsWith('#EXTM3U');
                    v.resolutions=[...body.matchAll(/RESOLUTION=(\d+x\d+)/gi)].map(x=>x[1]);
                  }
                }catch(e){v.error=String(e.message).slice(0,120)}
                result.sources.push(v);
              }
            }catch(e){result.error=String(e.message).slice(0,140)}
            console.log('STREAMPLAY_VIDSRC_SU_PROBE '+JSON.stringify(result));
          }
          NODE
