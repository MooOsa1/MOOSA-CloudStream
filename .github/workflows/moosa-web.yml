name: MOOSA Web checks

on:
  push:
    paths:
      - 'MOOSAWeb/**'
      - 'render.yaml'
      - '.github/workflows/moosa-web.yml'
  pull_request:
    paths:
      - 'MOOSAWeb/**'
      - 'render.yaml'
      - '.github/workflows/moosa-web.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MOOSAWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate server, browser scripts and API tests
        run: npm run check
