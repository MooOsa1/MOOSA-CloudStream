name: MOOSA Hub v151 original audio and Reya independent UHD/FHD verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'MOOSAHub/**'
      - '.github/workflows/moosa-hub-v126-tv-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build Android plugins and unit tests
        run: |
          gradle :MOOSAHub:testReleaseUnitTest :MOOSAHub:make :MOOSAArabic:make makePluginsJson ensureJarCompatibility --no-daemon
      - name: Verify actual TV Native settings and original operations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('MOOSAHub/src/main/kotlin/com/moosa/hub')
          s=(root/'MOOSASettingsDialog.kt').read_text()
          c=(root/'MOOSATVSettingsStyle.kt').read_text()
          sources=(root/'MOOSASourceTesterDialog.kt').read_text()
          servers=(root/'MOOSAServerManagerDialog.kt').read_text()
          versions={p['internalName']:p['version'] for p in json.loads(Path('build/plugins.json').read_text())}
          assert versions['MOOSAHub']==151,versions
          assert 'MOOSATVSettingsStyle.shell' in sources and 'MOOSATVSettingsStyle.shell' in servers
          assert 'MOOSATVSettingsStyle.window' in sources and 'MOOSATVSettingsStyle.window' in servers
          assert 'Color.rgb(8, 8, 8)' in c
          assert 'isFocusable = true' in c and 'setOnFocusChangeListener' in c
          assert 'SETTINGS / OVERVIEW' in s
          assert all(t in s for t in ('render()', 'Manage Providers','Manage Servers','Playback', 'Performance','Subtitles','focusByPage','restorePageFocus','Subtitle Help','rerenderWithoutLosingFocus'))
          assert 'MOOSASourceTesterDialog.show(requireContext())' in s
          assert 'MOOSAServerManagerDialog.show(requireContext())' in s
          assert 'MOOSASettingsStore.setVerifyLinks(verify)' in s
          assert 'MOOSASettingsStore.setProviderConcurrency(concurrency)' in s
          assert 'MOOSASettingsStore.setSubdlKey(key)' in s
          assert 'MOOSACloudStreamBridge' not in s
          assert 'MOOSACloudStreamBridge.start(context)' not in (root/'MOOSAHubPlugin.kt').read_text()
          assert not (root/'MOOSACloudStreamBridge.kt').exists()
          assert 'Everything, organized.' not in s
          assert 'subtitle-sync' not in s and 'subtitle-priority' not in s
          assert 'subtitle-more' not in s and 'subtitle-info' not in s
          assert 'focusByPage[owner] = focusKey' in s
          assert 'focusByPage[expectedPage]' in s
          assert 'findTaggedAction(shell.content, it)' in s
          assert 'Color.rgb(65, 65, 65)' in c
          assert 'if (primary && !selected) Color.BLACK else white' in c
          assert all(x in s for x in ('Providers','Search Performance','Subtitle Settings','Wyzie API Key','SubDL API Key'))
          assert all(x in sources for x in ('Enable All', 'Disable All', 'Test All Providers'))
          assert all(x in servers for x in ('Enable All', 'Disable All', 'Scan & Test Servers'))
          assert 'Web Bridge' not in s
          assert 'MOOSASourceTester.testAll(' in sources
          assert 'MOOSAServerRegistry.testAll(' in servers
          assert 'selectionControls.visibility = if (all.isEmpty()) View.GONE else View.VISIBLE' in servers
          assert 'disableOffline.visibility = if (all.any { it.lastResult == false })' in servers
          assert 'searchButton.visibility = if (all.isEmpty()) View.GONE else View.VISIBLE' in servers
          assert 'firstAction(shell.content)' in s
          assert not any('Color.rgb(64, 151, 220)' in x for x in (s,c,sources,servers))
          lens=(root/'MOOSAFocusLensView.kt').read_text()
          browse=(root/'MOOSABrowseDialog.kt').read_text()
          policy=(root/'MOOSABrowseFilters.kt').read_text()
          assert 'MOOSAFocusLensView(' in browse
          assert 'private fun updateLensPreview(' not in browse
          assert 'lensPreviewJob' not in browse
          assert 'focusLens.trapDpad(direction)' in browse
          assert 'onDraftChanged' in lens and 'onApply' in lens and 'onClose' in lens
          assert 'private fun renderYear()' in lens
          assert 'Last 3 years' in lens and 'Last 5 years' in lens
          assert 'fun trapDpad(direction: Int)' in lens
          assert 'setChosen(typeMovie' in lens and 'setChosen(typeSeries' in lens
          assert 'categoryTitle.text = request.name' in browse
          assert 'container.addOnLayoutChangeListener {' in browse
          assert '(height * 0.49f).toInt()' in browse
          assert 'dp(275)' in browse
          assert 'dp(335)' not in browse
          assert 'paintTab(button: Button, index: Int)' in lens
          assert 'tabUnderlines' in lens
          assert 'scroll.isVerticalScrollBarEnabled = true' in lens
          assert 'private val dismiss = button("×")' not in lens
          assert 'LayoutParams(-1, dp(41))' in lens
          assert 'private val optionRows = mutableListOf<List<Button>>()' in lens
          assert 'optionRows.add(group)' in lens
          assert 'optionRows.add(listOf(fromMinus, fromPlus, toMinus, toPlus))' in lens
          assert 'focusInsideList(destination)' in lens
          assert 'scroll.scrollTo(0, next)' in lens
          assert 'MOOSARefineDpadPlanner.next(' in lens
          planner=(root/'MOOSARefineDpadPlanner.kt').read_text()
          assert 'currentRow + 1' in planner and 'currentRow - 1' in planner
          assert 'currentRow == 2 && key == UP' in planner
          assert 'currentRow == 0 && key == DOWN' in planner
          assert 'return targetRow to desired.coerceIn(target.indices)' in planner
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSARefineDpadPlannerTest.kt').exists()
          assert 'withGenreToggle(' in lens
          assert 'with_watch_providers' in policy
          assert 'minimumRating' in policy and 'first_air_date' in policy
          assert 'yearMode' in policy and 'date.asc' in policy
          assert 'chipsRow' not in browse
          assert 'MOOSACatalog.browseBatch(' in browse
          assert 'with_watch_providers' in policy
          assert 'with_watch_monetization_types' in policy
          assert 'watch_region' in policy
          assert 'platformNames: List<String>' in policy
          assert 'watchRegions = listOf(' in policy
          assert 'AlertDialog.Builder(requireContext())' not in browse
          hub=(root/'MOOSAHubProvider.kt').read_text()
          registry=(root/'MOOSARecognizedExternalProvider.kt').read_text()
          assert 'MOOSARecognizedExternalProvider.shouldIncludeFromGlobal(' in hub
          native=(root/'MOOSACineStreamVaPlayerProvider.kt').read_text()
          tester=(root/'MOOSASourceTester.kt').read_text()
          assert 'listOf(native4KHDHub, nativeVixSrc, nativeNetMirror, nativeReya, nativeOpenDirectory, nativeVaPlayer, nativeVidrock, nativeVidzee)' in hub
          media=(root/'MOOSAHlsMediaQuality.kt').read_text()
          servers=(root/'MOOSAServerRegistry.kt').read_text()
          assert 'h264HeightFromTs(bytes: ByteArray)' in media
          assert 'firstTsSegmentUrl(playlistUrl: String, playlist: String)' in media
          assert 'firstMediaVariantUrl(masterUrl: String, playlist: String)' in media
          assert 'verifyVaPlayerMediaHeight(link, body)' in servers
          assert 'firstMediaVariantUrl(' in servers
          assert 'link.source != MOOSACineStreamVaPlayerPolicy.SOURCE_NAME' in servers
          assert 'bytes=0-32767' in servers
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSAHlsMediaQualityTest.kt').exists()
          assert 'if (api is MOOSACineStreamVaPlayerProvider)' in hub
          assert 'MOOSACineStreamVaPlayerPolicy.requestUrl(' in hub
          assert 'MOOSACineStreamVaPlayerPolicy.requestUrl(' in native
          assert 'MOOSACineStreamVaPlayerPolicy.hlsUrl(' in native
          vidrock=(root/'MOOSACineStreamVidrockProvider.kt').read_text()
          assert 'MOOSACineStreamVidrockPolicy.requestUrl(' in vidrock
          assert 'Cipher.getInstance("AES/GCM/NoPadding")' in vidrock
          assert 'this.quality = Qualities.Unknown.value' in vidrock
          assert 'MOOSACineStreamVidrockPolicy.decryptUrl(encrypted)' in vidrock
          assert 'MOOSACineStreamVidrockProvider()' in tester
          assert tester.count('title = "Better Call Saul", tmdbId = 60059, isTv = true') >= 2
          assert tester.count('season = 2, episode = 1') >= 3
          assert 'title = "Better Call Saul", imdbId = "tt3032476"' in tester
          assert 'detail = state.detail' in tester
          assert 'No HTTPS HLS links from source' in tester
          diag=(root/'MOOSANativeSourceDiagnostics.kt').read_text()
          assert 'ConcurrentHashMap' in diag
          dialog=(root/'MOOSASourceTesterDialog.kt').read_text()
          assert 'refs.detail?.text = state.detail' in dialog
          assert 'Test: ' in dialog
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSANativeSourceDiagnosticsTest.kt').exists()
          assert 'MOOSACineStreamVidzeeProvider()' in tester
          vidzee=(root/'MOOSACineStreamVidzeeProvider.kt').read_text()
          assert 'MOOSACineStreamVidzeePolicy.decryptHls(' in vidzee
          assert 'Cipher.getInstance("AES/CBC/PKCS5Padding")' in vidzee
          assert 'val gate = Semaphore(3)' in vidzee
          assert 'this.quality = Qualities.Unknown.value' in vidzee
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSACineStreamVidzeePolicyTest.kt').exists()
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSACineStreamVidrockPolicyTest.kt').exists()

          assert 'this.quality = Qualities.Unknown.value' in native
          assert 'ExtractorLinkType.M3U8' in native
          assert 'MOOSACineStreamVaPlayerProvider()' in tester
          assert 'testNativeSource(' in tester
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSACineStreamVaPlayerPolicyTest.kt').exists()
          assert 'isAnime || isRecognized(name)' in registry
          assert '"cinestream", "streamplay"' in registry
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSARecognizedExternalProviderTest.kt').exists()
          uhd_provider=(root/'MOOSA4KHDHubProvider.kt').read_text()
          uhd_policy=(root/'MOOSA4KHDHubPolicy.kt').read_text()
          hub=(root/'MOOSAHubProvider.kt').read_text()
          assert 'MOOSA4KHDHubProvider()' in hub
          assert 'MOOSAOpenDirectoryProvider()' in hub
          assert 'MOOSAReyaProvider()' in hub
          assert 'api is MOOSAReyaProvider' in hub
          assert 'MOOSAReyaPolicy.identity(' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'MOOSAReyaPolicy.subtitles(' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'MOOSAReyaPolicy.finalCueSeconds(' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'MOOSAReyaPolicy.playlistSeconds(' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'MOOSAReyaPolicy.subtitleCutMatches(' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'MOOSAReyaPolicy.provenWrongCut(' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'MOOSAReyaPolicy.verificationLanes(' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'val videoSeconds = MOOSAReyaPolicy.playlistSeconds(response.text)' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'link.timelineVerified && sub.source.equals(link.source, true)' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'regressionPreserves4KWhenTimelineMetadataIsUnavailable' in (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSAReyaPolicyTest.kt').read_text()
          assert 'readableNativeCaptions.filter' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'cache.vdrk.site' in (root/'MOOSAReyaPolicy.kt').read_text()
          assert 'Reya Native' in hub
          assert 'MOOSAReyaPolicy.inspectInit(' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'isFmp4Fragment(' in (root/'MOOSAReyaProvider.kt').read_text()
          assert 'MOOSAAudioTrackPolicy.accept(' in (root/'MOOSAReyaProvider.kt').read_text()
          audio_policy=(root/'MOOSAAudioTrackPolicy.kt').read_text()
          assert 'if (languages == null) return true' in audio_policy
          assert 'if (languages.isEmpty()) return false' in audio_policy
          assert 'languages.any { normalize(it) == null }' in audio_policy
          assert 'if (audioLines.isEmpty()) return true' in (root/'MOOSAVixSrcPolicy.kt').read_text()
          audio_test=(Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSAAudioTrackPolicyTest.kt').read_text()
          assert 'unknownAudioMetadataDoesNotHidePlayableForeignFilms' in audio_test
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSAReyaPolicyTest.kt').exists()

          assert 'MOOSAAudioTrackPolicy.accept(' in (root/'MOOSA4KHDHubProvider.kt').read_text()
          assert 'MOOSAAudioTrackPolicy.accept(' in (root/'MOOSANetMirrorProvider.kt').read_text()
          assert 'MOOSAAudioTrackPolicy.accept(' in (root/'MOOSAOpenDirectoryProvider.kt').read_text()
          assert (root/'MOOSAAudioTrackPolicy.kt').exists()
          assert (root/'MOOSAOpenDirectoryPolicy.kt').exists()
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSAOpenDirectoryPolicyTest.kt').exists()
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSAAudioTrackPolicyTest.kt').exists()

          assert 'request.isTv && it is MOOSA4KHDHubProvider' in hub
          assert 'div.episodes-list div.season-item' in uhd_provider
          assert 'div.episode-download-item' in uhd_provider
          assert 'isStandaloneEpisodeFile(fileInfo)' in uhd_provider
          assert 'take(3)' in uhd_provider
          assert 'take(2)' in uhd_provider
          assert 'api is MOOSA4KHDHubProvider' in hub
          assert 'verifyRealVideo(video, filePageUrl, requiredQuality, sizeGb, originalLanguage)' in uhd_provider
          assert 'sortedBy(::releaseSizeGb)' in uhd_provider
          assert 'response.code != 206' in uhd_provider
          assert 'compatibleVideo(bytes.copyOf(count))' in uhd_provider
          assert 'isCompatibleRelease(filename)' in uhd_provider
          assert 'exactCatalogMatch(' in uhd_provider
          assert 'bytes=0-131071' in uhd_provider
          assert '0x1654AE6BL' in uhd_policy
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSA4KHDHubPolicyTest.kt').exists()
          vix_provider=(root/'MOOSAVixSrcProvider.kt').read_text()
          vix_policy=(root/'MOOSAVixSrcPolicy.kt').read_text()
          assert 'MOOSAVixSrcProvider()' in hub
          assert 'if (api is MOOSAVixSrcProvider)' in hub
          assert 'hdVariants(' in vix_provider
          assert 'firstSegment(' in vix_provider
          assert 'bytes=0-${readLimit - 1}' in vix_provider
          assert 'RESOLUTION=' in vix_policy
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSAVixSrcPolicyTest.kt').exists()
          netmirror=(root/'MOOSANetMirrorProvider.kt').read_text()
          netpolicy=(root/'MOOSANetMirrorPolicy.kt').read_text()
          assert 'MOOSANetMirrorProvider()' in hub
          assert 'api is MOOSANetMirrorProvider' in hub
          assert 'compatibleMp4(evidence)' in netmirror
          assert 'currentEpisode' in netpolicy and 'currentSeason' in netpolicy
          assert (Path('MOOSAHub/src/test/kotlin/com/moosa/hub')/'MOOSANetMirrorPolicyTest.kt').exists()
          assert 'explicitlyAudioOnly(body)' in servers
          print('PASS: v151: preserve unlabelled audio and verify Reya video/captions independently')
          PY
